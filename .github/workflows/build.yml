              private fun updateStatus() {
                  val svc = if (MJService.instance != null) "ON" else "OFF"
                  val ovl = if (Settings.canDrawOverlays(this)) "OK" else "NAHI"
                  val mic = if (micGranted()) "OK" else "NAHI"
                  val bri = if (Settings.System.canWrite(this)) "OK" else "NAHI"
                  status.text = "Accessibility: $svc | Display over apps: $ovl | Mic: $mic | Brightness: $bri"
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  updateStatus()
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
                  showLogs()
                  MJService.sink = { line -> runOnUiThread { logView.append(line + "\n") } }
              }

              override fun onPause() {
                  super.onPause()
                  MJService.sink = null
              }

              private fun showLogs() {
                  val copy = synchronized(MJService.logs) { ArrayList(MJService.logs) }
                  logView.text = copy.joinToString("\n")
              }

              private fun send() {
                  val t = cmdBox.text.toString().trim()
                  if (t.isEmpty()) return
                  val s = MJService.instance
                  if (s == null) {
                      Toast.makeText(this, "Pehle Accessibility ON karein", Toast.LENGTH_LONG).show()
                      return
                  }
                  cmdBox.setText("")
                  s.runCommand(t)
                  moveTaskToBack(true)
              }
          }
