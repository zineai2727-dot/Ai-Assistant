                  AppDef(listOf("facebook", "फेसबुक"), "Facebook", "फेसबुक"),
                  AppDef(listOf("instagram", "इंस्टाग्राम"), "Instagram", "इंस्टाग्राम"),
                  AppDef(listOf("tiktok", "टिकटॉक", "टिक टॉक"), "TikTok", "टिकटॉक"),
