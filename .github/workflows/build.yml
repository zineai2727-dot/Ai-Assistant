          package com.waqas.mj

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var logView: TextView
              private lateinit var cmdBox: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("mj", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(pad, pad * 2, pad, pad)

                  fun label(t: String, size: Float = 14f): TextView {
                      val v = TextView(this)
                      v.text = t
                      v.textSize = size
                      col.addView(v)
                      return v
                  }

                  fun button(t: String, onClick: () -> Unit): Button {
                      val b = Button(this)
                      b.text = t
                      b.setOnClickListener { onClick() }
                      col.addView(b)
                      return b
                  }

                  label("MJ Assistant", 26f)
                  status = label("")

                  button("1) Accessibility ON karein") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  button("2) Display over other apps allow karein") {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  }
                  button("4) Mic permission allow karein") { askMic() }

                  label("Gemini API key")
                  val keyBox = EditText(this)
                  keyBox.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  keyBox.setText(prefs.getString("key", ""))
                  col.addView(keyBox)

                  label("Model (default: ${Brain.DEFAULT_MODEL})")
                  val modelBox = EditText(this)
                  modelBox.setText(prefs.getString("model", Brain.DEFAULT_MODEL))
                  col.addView(modelBox)

                  val voice = CheckBox(this)
                  voice.text = "Awaz mein jawab (Hindi voice)"
                  voice.isChecked = prefs.getBoolean("voice", true)
                  col.addView(voice)

                  val bubble = CheckBox(this)
                  bubble.text = "Floating mic bubble (har screen par)"
                  bubble.isChecked = prefs.getBoolean("bubble", true)
                  col.addView(bubble)

                  button("3) Save") {
                      prefs.edit()
                          .putString("key", keyBox.text.toString().trim())
                          .putString("model", modelBox.text.toString().trim().ifEmpty { Brain.DEFAULT_MODEL })
                          .putBoolean("voice", voice.isChecked)
                          .putBoolean("bubble", bubble.isChecked)
                          .apply()
                      MJService.instance?.refreshBubble()
                      Toast.makeText(this, "Save ho gaya", Toast.LENGTH_SHORT).show()
                  }

                  label("Command likhein ya bolein")
                  cmdBox = EditText(this)
                  cmdBox.hint = "jaise: flashlight 3 second on karo"
                  col.addView(cmdBox)

                  button("Send") { send() }
                  button("Mic (bol kar)") {
                      val s = MJService.instance
                      if (s == null) {
                          Toast.makeText(this, "Pehle Accessibility ON karein", Toast.LENGTH_LONG).show()
                      } else if (!micGranted()) {
                          askMic()
                      } else {
                          s.startListening()
                      }
                  }

                  logView = label("", 12f)

                  val scroll = ScrollView(this)
                  scroll.addView(col)
                  setContentView(scroll)
              }

              private fun micGranted(): Boolean =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun askMic() {
                  if (micGranted()) {
                      Toast.makeText(this, "Mic permission pehle se hai", Toast.LENGTH_SHORT).show()
                  } else {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 2)
                  }
              }

              private fun updateStatus() {
                  val svc = if (MJService.instance != null) "ON" else "OFF"
                  val ovl = if (Settings.canDrawOverlays(this)) "OK" else "NAHI"
                  val mic = if (micGranted()) "OK" else "NAHI"
                  status.text = "Accessibility: $svc  |  Display over apps: $ovl  |  Mic: $mic"
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  updateStatus()
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
                  showLogs()
                  MJService.sink = { line -> runOnUiThread { logView.append(line + "\n") } }
              }

              override fun onPause() {
                  super.onPause()
                  MJService.sink = null
              }

              private fun showLogs() {
                  val copy = synchronized(MJService.logs) { ArrayList(MJService.logs) }
                  logView.text = copy.joinToString("\n")
              }

              private fun send() {
                  val t = cmdBox.text.toString().trim()
                  if (t.isEmpty()) return
                  val s = MJService.instance
                  if (s == null) {
                      Toast.makeText(this, "Pehle Accessibility ON karein", Toast.LENGTH_LONG).show()
                      return
                  }
                  cmdBox.setText("")
                  s.runCommand(t)
                  moveTaskToBack(true)
              }
          }
