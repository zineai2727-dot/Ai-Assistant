              private val OPEN_WORDS = listOf(
                  "open", "kholo", "khol", "kholiye", "kholna", "ओपन", "खोलो", "खोल", "खोलिए", "کھولو"
              )

              private val NOT_OPEN = listOf(
                  "chat", "चैट", "ki", "की", "ka", "का", "ke", "के", "ko", "को", "pe", "pr", "par", "पर", "पे", "mein", "में"
              )

              private val PUNCT = ".,!?;:\"'()[]{}।|-_/\\"

              private fun norm(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s.lowercase()) {
                      sb.append(
                          when {
                              ch in '٠'..'٩' -> '0' + (ch - '٠')
                              ch in '۰'..'۹' -> '0' + (ch - '۰')
                              ch in '०'..'९' -> '0' + (ch - '०')
                              PUNCT.indexOf(ch) >= 0 -> ' '
                              else -> ch
                          }
                      )
                  }
                  return sb.toString().replace(Regex("\\s+"), " ").trim()
              }

              /** Short plain ASCII words must match a whole word; Hindi or multi-word phrases match anywhere. */
              private fun has(c: String, t: Set<String>, words: List<String>): Boolean =
                  words.any { w -> if (w.all { it in 'a'..'z' }) t.contains(w) else c.contains(w) }

              // ------------------------------------------------------------------ public

              /** Speech or typed text of the user. */
              fun parse(text: String, maxWords: Int = 8): Cmd? {
                  val c = norm(text)
                  if (c.isEmpty()) return null
                  val words = c.split(" ")
                  if (words.size > maxWords) return null
                  if (JOIN.containsMatchIn(c)) return null
                  val t = words.toSet()
                  if (has(c, t, OTHER_INTENT)) return null

                  val found = ArrayList<Cmd>()
                  volume(c, t)?.let { found.add(it) }
                  brightness(c, t)?.let { found.add(it) }
                  nav(c, t)?.let { found.add(it) }
                  openApp(c, t)?.let { found.add(it) }
                  return if (found.size == 1) found[0] else null
              }

              /** One short English task sentence written by Gemini. */
              fun parseTask(task: String): Cmd? {
                  val c = norm(task)
                  if (c.isEmpty()) return null
                  if (c.split(" ").size > 12 || JOIN.containsMatchIn(c)) return null

                  val yt = Regex("^search (?:for )?(.+?) (?:on|in) youtube$").find(c)
                  if (yt != null) {
                      return Cmd(
                          "youtube_search", JSONObject().put("query", yt.groupValues[1]),
                          "YouTube par search khol diya", "यूट्यूब पर सर्च खोल दिया।"
                      )
                  }
                  val web = Regex("^(?:search|google) (?:for )?(.+?)(?: (?:on|in) (?:google|chrome))?$").find(c)
                  if (web != null && !c.contains("youtube")) {
                      return Cmd(
                          "web_search", JSONObject().put("query", web.groupValues[1]),
                          "Chrome mein search khol diya", "क्रोम में सर्च खोल दिया।"
                      )
                  }
                  val o = Regex("^open (?:the )?([a-z0-9 .&-]{2,30}?)(?: app| application)?$").find(c)
                  if (o != null) {
                      val name = o.groupValues[1].trim()
                      val bad = listOf(
                          "chat", "message", "video", "song", "page", "file", "folder", "contact", "profile",
                          "link", "search", "play"
                      )
                      if (name.split(" ").size <= 3 && bad.none { name.contains(it) }) {
                          return Cmd(
                              "open_app", JSONObject().put("name", name),
                              "$name khol diya", "$name खुल गया।"
                          )
                      }
                  }
                  return parse(task, 12)
              }

              // ------------------------------------------------------------------ pieces

              private fun volume(c: String, t: Set<String>): Cmd? {
                  val vol = listOf(
                      "volume", "वॉल्यूम", "वोल्यूम", "वॉल्युम", "वाल्यूम", "आवाज", "awaz", "awaaz", "آواز"
                  )
                  if (!has(c, t, vol)) return null
                  val full = listOf("full", "फुल", "पूरा", "पूरी", "poora", "pura", "poori", "max", "maximum", "मैक्स", "मैक्सिमम")
                  val mute = listOf("mute", "म्यूट", "zero", "जीरो", "शून्य", "बंद", "band")
                  val up = listOf(
                      "up", "badha", "badhao", "bada", "बढ़ा", "बढ़ाओ", "बढा", "ज्यादा", "zyada", "tez", "तेज",
                      "increase", "raise", "louder"
                  )
                  val down = listOf(
                      "down", "kam", "कम", "ghata", "ghatao", "घटा", "घटाओ", "halka", "हल्का", "decrease", "lower", "quieter"
                  )
                  val pct = Regex("(\\d{1,3}) ?(?:%|percent|प्रतिशत|फीसदी)").find(c)?.groupValues?.get(1)?.toIntOrNull()
                      ?: Regex("(?:to|par|पर) (\\d{1,3})\\b").find(c)?.groupValues?.get(1)?.toIntOrNull()
                  val args = JSONObject()
                  return when {
                      pct != null -> {
                          val p = pct.coerceIn(0, 100)
                          args.put("level", p)
                          Cmd("volume", args, "Volume $p% kar diya", "वॉल्यूम $p प्रतिशत कर दिया।")
                      }
                      has(c, t, full) -> {
                          args.put("level", 100)
                          Cmd("volume", args, "Volume full kar diya", "वॉल्यूम फुल कर दिया।")
                      }
                      has(c, t, mute) -> {
                          args.put("level", 0)
                          Cmd("volume", args, "Volume mute kar diya", "वॉल्यूम म्यूट कर दिया।")
                      }
                      has(c, t, up) -> {
                          args.put("direction", "up")
                          Cmd("volume", args, "Volume badha diya", "वॉल्यूम बढ़ा दिया।")
                      }
                      has(c, t, down) -> {
                          args.put("direction", "down")
                          Cmd("volume", args, "Volume kam kar diya", "वॉल्यूम कम कर दिया।")
                      }
                      else -> null
                  }
              }

              private fun brightness(c: String, t: Set<String>): Cmd? {
                  val b = listOf("brightness", "ब्राइटनेस", "ब्राइटनस", "brightnes", "roshni", "रोशनी", "روشنی")
                  if (!has(c, t, b)) return null
                  val full = listOf("full", "फुल", "पूरा", "पूरी", "poora", "pura", "poori", "max", "maximum", "मैक्स")
                  val low = listOf("low", "लो", "dim", "halki", "हल्की", "halka", "हल्का", "min", "minimum", "decrease", "lower", "kam", "कम")
                  val half = listOf("half", "aadhi", "आधी", "आधा", "adha")
                  val up = listOf("up", "badha", "badhao", "बढ़ा", "बढ़ाओ", "बढा", "ज्यादा", "zyada", "increase", "raise")
                  val pct = Regex("(\\d{1,3}) ?(?:%|percent|प्रतिशत|फीसदी)").find(c)?.groupValues?.get(1)?.toIntOrNull()
                      ?: Regex("(?:to|par|पर) (\\d{1,3})\\b").find(c)?.groupValues?.get(1)?.toIntOrNull()
                  val level = when {
                      pct != null -> pct.coerceIn(0, 100)
                      has(c, t, full) -> 100
                      has(c, t, half) -> 50
                      has(c, t, low) -> 15
                      has(c, t, up) -> 80
                      else -> return null
                  }
                  val word = if (level == 100) "full" else "$level%"
                  val hword = if (level == 100) "फुल" else "$level प्रतिशत"
                  return Cmd(
                      "brightness", JSONObject().put("level", level),
                      "Brightness $word kar di", "ब्राइटनेस $hword कर दी।"
                  )
              }

              private fun nav(c: String, t: Set<String>): Cmd? {
                  if (has(c, t, listOf("screenshot", "स्क्रीनशॉट", "स्क्रीन शॉट", "सक्रीनशॉट"))) {
                      return Cmd("screenshot", JSONObject(), "Screenshot le liya", "स्क्रीनशॉट ले लिया।")
                  }
                  val lock = listOf("lock", "लॉक", "लाक")
                  val what = listOf("screen", "phone", "mobile", "स्क्रीन", "फोन", "फ़ोन", "मोबाइल", "सक्रीन")
                  if (has(c, t, lock) && has(c, t, what)) {
                      return Cmd("lock_screen", JSONObject(), "Phone lock kar diya", "फोन लॉक कर दिया।")
                  }
                  val go = listOf("jao", "go", "press", "जाओ", "चलो", "कर", "करो", "kar", "karo")
                  if (has(c, t, listOf("home", "होम")) && has(c, t, go + listOf("screen", "par", "स्क्रीन", "पर", "बटन", "button"))) {
                      return Cmd("home", JSONObject(), "Home par aa gayi", "होम पर आ गई।")
                  }
                  if (has(c, t, listOf("back", "पीछे", "peeche")) && has(c, t, go)) {
                      return Cmd("back", JSONObject(), "Peeche aa gayi", "पीछे आ गई।")
                  }
                  return null
              }

              private fun openApp(c: String, t: Set<String>): Cmd? {
                  if (!has(c, t, OPEN_WORDS)) return null
                  if (c.split(" ").size > 4) return null
                  if (has(c, t, NOT_OPEN)) return null
                  for (a in APPS) {
                      if (has(c, t, a.names)) {
                          return Cmd(
                              "open_app", JSONObject().put("name", a.label),
                              "${a.label} khol diya", "${a.hindi} खुल गया।"
                          )
                      }
                  }
                  return null
              }
