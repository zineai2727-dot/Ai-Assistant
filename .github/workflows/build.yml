          /**
           * MJ's body: an accessibility service that can read the screen and act on it.
           *
           * Flow of one turn:
           *   1. hear: record the user's voice and send the audio itself to Gemini (no word-by-word mis-hearing)
           *   2. understand: Gemini returns what was said, and either a chat reply or a list of separate tasks
           *   3. do: every task runs on its own with its own step limit, one after the other
           *   4. speak the result, then listen again (conversation mode) until the user says bas / stays silent
           *
           * Safety rules built in:
           *  - flashlight, volume, brightness, open app, searches are direct phone commands (no screen tapping)
           *  - after every action MJ waits for the screen to settle and tells the AI if nothing changed
           *  - the same action on the same screen twice in a row stops the task (no endless tapping)
           *  - 15 steps per task, and a STOP button / bubble tap always cancels
           *  - payment / delete style buttons are blocked unless the user asked for them
           */
          class MJService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: MJService? = null
                  val logs = ArrayList<String>()

                  @Volatile
                  var sink: ((String) -> Unit)? = null

                  private val SENSITIVE = listOf(
                      "pay", "send money", "transfer", "delete", "uninstall",
                      "purchase", "buy", "erase", "factory reset", "remove account"
                  )

                  private val RISKY = Regex(
                      "delete|remove|erase|uninstall|format|factory|reset|unsend|\\bpay\\b|send money|transfer|purchase|\\bbuy\\b"
                  )

                  private val DIRECT = setOf(
                      "flashlight", "open_app", "youtube_search", "web_search", "call", "volume", "brightness",
                      "maps", "open_settings", "lock_screen", "screenshot", "quick_settings"
                  )
              }

              private class TaskResult(val ok: Boolean, val msg: String, val speak: String)

              private enum class Mode { IDLE, LISTEN, WORK }

              private val ui = Handler(Looper.getMainLooper())

              @Volatile
              private var cancelled = false
              private val busy = AtomicBoolean(false)
              private val chat = ArrayList<String>()

              private var overlay: LinearLayout? = null
              private var statusView: TextView? = null
              private var bubble: TextView? = null
              private var bubbleBg: GradientDrawable? = null
              private var recognizer: SpeechRecognizer? = null

              private var tts: TextToSpeech? = null

              @Volatile
              private var speakLatch: CountDownLatch? = null

              @Volatile
              private var speakId = ""
              private var speakCounter = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          try {
                              val r = tts?.setLanguage(Locale("hi", "IN"))
                              if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                                  tts?.setLanguage(Locale.getDefault())
                              }
                          } catch (e: Exception) {
                          }
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}

                              override fun onDone(utteranceId: String?) {
                                  if (utteranceId == speakId) speakLatch?.countDown()
                              }

                              override fun onError(utteranceId: String?) {
