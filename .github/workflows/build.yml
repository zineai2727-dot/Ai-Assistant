          package com.waqas.mj

          import android.view.accessibility.AccessibilityNodeInfo

          /** A numbered picture of what is on screen right now. */
          class ScreenSnapshot(
              val text: String,
              val nodes: List<AccessibilityNodeInfo>,
              val hash: Int,
              val pkg: String
          )

          object ScreenReader {

              fun read(root: AccessibilityNodeInfo?): ScreenSnapshot {
                  if (root == null) return ScreenSnapshot("(screen not readable)", emptyList(), 0, "")
                  val nodes = ArrayList<AccessibilityNodeInfo>()
                  val sb = StringBuilder()
                  walk(root, nodes, sb)
                  val body = if (sb.isEmpty()) "(empty screen)" else sb.toString()
                  return ScreenSnapshot(body, nodes, body.hashCode(), root.packageName?.toString() ?: "")
              }

              private fun walk(n: AccessibilityNodeInfo?, nodes: ArrayList<AccessibilityNodeInfo>, sb: StringBuilder) {
                  if (n == null || nodes.size >= 80 || !n.isVisibleToUser) return
                  val label = (n.text?.toString() ?: n.contentDescription?.toString() ?: n.hintText?.toString() ?: "").trim()
                  val keep = n.isClickable || n.isEditable || n.isScrollable || n.isCheckable || label.isNotEmpty()
                  if (keep) {
                      val kind = when {
                          n.isEditable -> "input"
                          n.isClickable -> "button"
                          n.isScrollable -> "scroll"
                          else -> "text"
                      }
                      sb.append('[').append(nodes.size).append("] ").append(kind)
                      if (label.isNotEmpty()) {
                          sb.append(" \"").append(label.take(60).replace("\n", " ")).append('"')
                      }
                      if (n.isChecked) sb.append(" (checked)")
                      sb.append('\n')
                      nodes.add(n)
                  }
                  for (i in 0 until n.childCount) {
                      walk(n.getChild(i), nodes, sb)
                  }
              }
          }
          MJEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'MJEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MJ</string>
              <string name="service_desc">MJ aap ke kehne par screen padhti hai aur tap, type, scroll jaise kaam karti hai.</string>
          </resources>
          MJEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'MJEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          MJEOF
          cat > build.gradle.kts <<'MJEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          MJEOF
          cat > gradle.properties <<'MJEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          MJEOF
          cat > settings.gradle.kts <<'MJEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MJ"
          include(":app")
          MJEOF
          base64 -d app/mj.keystore.b64 > app/mj.keystore
          echo 'project written:' && find . -type f -not -path './.git/*' | head -50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJ-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mj-build-${{ github.run_number }}
          name: MJ build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
