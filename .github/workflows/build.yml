name: Build MJ APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write MJ project files
        run: |
          set -e
          cat > README.md <<'MJEOF'
          # MJ - personal phone assistant (Android)

          Accessibility Service + Gemini. Quick commands (flashlight) run locally with no AI; everything else is planned one step at a time by Gemini, with loop guards, a STOP button and a 20-step limit.

          Build: push this project to GitHub; the workflow in `.github/workflows/build.yml` builds `app-debug.apk` and publishes it under Releases.

          First run on the phone:
          1. Open MJ -> "Accessibility ON karein" -> MJ -> turn on.
          2. "Display over other apps" -> allow MJ.
          3. Paste a Gemini API key (https://aistudio.google.com/apikey), tap Save.
          4. Type or speak a command, tap Send.
          MJEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'MJEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.waqas.mj"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.waqas.mj"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 13
                  versionName = "1.8"
              }

              // One fixed key for every build, so a new APK installs over the old one.
              signingConfigs {
                  create("mj") {
                      storeFile = file("mj.keystore")
                      storePassword = "mjassistant"
                      keyAlias = "mj"
                      keyPassword = "mjassistant"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("mj")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              // Vosk: offline speech recognition (wake word and offline commands)
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47")
          }
          MJEOF
          mkdir -p app
          cat > app/mj.keystore.b64 <<'MJEOF'
          
          MJEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'MJEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MJService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <service
                      android:name=".WakeService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          MJEOF
          mkdir -p app/src/main/java/com/waqas/mj
          cat > app/src/main/java/com/waqas/mj/Brain.kt <<'MJEOF'
          package com.waqas.mj

          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /** Talks to Gemini. Jobs: understand what the user said, pick the next screen action, confirm risky work. */
          object Brain {

              const val DEFAULT_MODEL = "gemini-flash-lite-latest"

              // ---------------------------------------------------------------- prompts

              private fun understandSystem(name: String): String = """
          You are MJ, a warm, caring female assistant living inside the Android phone of $name, a Pakistani Muslim from Sindh.
          $name speaks Urdu, Hindi and English, often mixed in one sentence and in a Roman Urdu style. Voice input can be misheard, so understand by sound and meaning, not literally.
          Religious words such as Quran, Qul, Char Qul, Surah, Naat, Allah, Namaz, Dua, Tilawat are common. If a mishearing sounds like one of them (for example chaar qul, char kul, 4 kul, kuran), choose the religious meaning.
          Game and app names (Free Fire, PUBG, WhatsApp, YouTube, VLC, Chrome) stay in English.

          Input is either audio of what he said, or his typed text. Answer with ONE JSON object:
          - heard: what he said, written in Roman Urdu with Latin letters. Keep English words in English.
          - mode: one of tasks, chat, stop, none.
            tasks = he wants the phone to DO something (open, play, search, call, volume, brightness, flashlight, lock the phone, maps and distance, settings, read the screen, send a message, anything on the phone).
            chat = talking, feelings, greetings, thanks, jokes, questions you can answer yourself, i love you, good night.
            stop = he is ending the conversation (bas, nahi, theek hai shukriya, allah hafiz, khatam, rehne do).
            none = you could not hear or understand anything.
          - tasks: only for mode tasks. A list of SEPARATE phone tasks in the order he said them. One short plain English sentence each, with exact app names and search words, for example ["Open YouTube", "Play the song Tere Naam on YouTube", "Set volume to full", "Call Zameer", "Send SMS to Zameer saying Salam"]. Open a person's chat as "Open Zameer's WhatsApp chat". Each task must be about ONE goal only. Never merge two apps or two unrelated goals into one task. Never invent tasks. Steps that depend on each other (take a photo THEN send that photo; find a message THEN react to it; open a chat THEN send a voice note) must stay in ONE task written as one sentence, because a later task cannot see what an earlier one did. Do not add a separate task that only opens an app when a later task already opens it (opening a person's WhatsApp chat opens WhatsApp itself).
          - reply: a short natural answer in Roman Urdu (Latin letters) for the screen.
            For mode tasks the reply is ONLY a short acknowledgement such as Ji, abhi karti hoon. It must NEVER say that anything is already done, never describe a result, never promise something you cannot do, and never say goodbye. The work has not happened yet when this reply is spoken.
          - remember: optional. If he asks you to remember, keep or note something (yaad rakho, note kar lo), put it here as one short plain sentence (for example "Ammi's number is 0300..."). Otherwise leave it empty.
          - speak: the same reply written in Hindi Devanagari so a Hindi voice can say it. Spell Urdu and Islamic words properly (क़ुरान, अल्लाह, अस्सलामु अलैकुम, शुक्रिया, नमाज़). No emoji.

          You are given THINGS TO REMEMBER and RECENT WORK (what you did earlier, with DONE or NOT DONE). Use them:
          - If he asks what you did, whether something was done, or says "check karo / kya hua / jo abhi bola wo kiya": answer honestly in mode chat from RECENT WORK. NOT DONE means it did not happen.
          - If he says to do the earlier work again or finish it ("peeche wala kaam karo", "jo adhoora tha"), make tasks from the NOT DONE items of RECENT WORK, written in full so nothing needs the old context.
          - If he asks you to check something on the phone now (is the message sent, is the song playing), make ONE task: "Check on the screen whether <that thing> is done and tell me what you see".
          - Never say you have no earlier task when RECENT WORK lists one.
          - A phone number is used only if he gave ALL digits (10 or more); otherwise give only the name.

          How MJ talks: like a close, kind friend. Warm, natural, one to three short sentences, never robotic and never like a manual. Notice his feeling first: if he is sad, tired, worried or happy, respond to that. Use his name only now and then. Never call him Boss, sir or any title.
          If he says i love you or something affectionate, answer with warmth and gratitude as a caring friend and helper, and say you are always here to help him. You are an AI assistant, not a person and not a romantic partner, so do not claim to love him back and do not promise to be everything for him. Stay gentle and honest.
          For good night wish him a peaceful night and a dua. Use the earlier conversation for context.
          """

              private const val SYSTEM = """
          You are MJ, a fast and reliable assistant that controls an Android phone through an accessibility service.
          Each turn you get ONE CURRENT TASK, the tasks ALREADY DONE and the tasks LEFT FOR LATER (they belong to the user's wider request and are handled separately), the current app, a numbered list of what is on screen, and the actions already taken.
          Reply with exactly ONE next action as a FLAT JSON object, for example {"action":"tap","id":3} or {"action":"open_app","name":"WhatsApp"}.
          Always put the needed fields directly in the object. Never leave a needed field out.

          Actions and their fields:
          - flashlight: on (true/false), seconds (optional; turns on, waits, turns off)
          - open_app: name
          - youtube_search: query
          - web_search: query (opens a Google search in Chrome)
          - maps: query, route (true = driving route from the current location, the screen then shows distance and time; false = just search the place)
          - open_settings: page (wifi, bluetooth, location, hotspot, airplane, display, sound, battery, data, nfc, storage, apps, date, accessibility)
          - call_contact: name, number (optional; use when the user gave a number). Calls a person from the phone contacts.
          - whatsapp_chat: name, number (optional), text (optional). Opens that person's WhatsApp chat directly. With text, MJ types the message and presses Send itself, exactly once: never press Send yourself.
          - share_latest: name, number (optional), kind (photo or video), text (optional caption). Sends the newest photo or video from the gallery to that person on WhatsApp; MJ presses Send itself, once.
          - watch: text (what to wait for, e.g. "the generated image is ready"), seconds (max time to wait, default 120, max 600). MJ keeps looking at the screen by itself and comes back when it happened or time ran out. Use it for anything that takes a while.
          - alarm: hour (0-23), minute (0-59), text (label, optional). Sets an alarm at the next such time. For a reminder use the alarm with the reminder as text.
          - timer: seconds (total length), text (label, optional)
          - look: text (the question). MJ takes a screenshot and a vision model answers the question about what the picture shows (photos, images, anything not readable as text). The answer comes back in ACTIONS SO FAR; then call done with it.
          - long_press: id
          - hold: id, seconds (press and hold; on the WhatsApp microphone button it records a voice note: seconds = how long the user wants to talk, default 10, max 55; letting go sends it)
          - send_sms: name, number (optional), text. Sends an SMS by itself, one time.
          - call: number (opens the dialer with a number)
          - volume: level (0 to 100, 100 is full) or direction (up, down, mute, unmute)
          - brightness: level (0 to 100, 100 is full)
          - lock_screen, screenshot, quick_settings: no fields
          - tap: id
          - type: id, text
          - enter: id (optional; presses the keyboard Enter/Search key)
          - scroll: direction (up or down), id (optional)
          - back, home, recents, notifications: no fields
          - wait: ms (up to 5000)
          - say: text
          - done: message, speak, ok (use only these three fields)

          Rules:
          0. Do ONLY the CURRENT TASK. Never do work that belongs to ALREADY DONE or LEFT FOR LATER tasks. The moment the CURRENT TASK is finished, call done.
          1. Prefer direct actions (flashlight, open_app, youtube_search, web_search, maps, open_settings, call, volume, brightness, lock_screen, screenshot, back, home) over tapping the screen. They are faster and cannot loop.
          2. Use element ids from the current screen list only. Ids change every turn. tap and type always need an id.
          3. If the last action says "screen did not change", do NOT repeat it. Try another element, scroll, or a different approach.
          4. Be efficient. Most tasks need 1 to 5 actions. Never tap things that the task does not need. After open_app or a search the screen has already settled; only if the list is nearly empty or shows a loading spinner, use wait once.
          5. Playing something on YouTube: after youtube_search the results are on screen. Tap the best matching real video at once (not an ad, not a Shorts shelf), then check the next screen. Never tap the search box, never press enter and never call youtube_search a second time: the results are already there.
          6. Music or video player apps such as VLC: open_app, use the search icon or field, type the song name, tap the matching result.
          7. People and messages: to call a person use call_contact; to open a person's WhatsApp chat or to send a WhatsApp message use whatsapp_chat; to send an SMS use send_sms. These find the contact by name and, if the person has several numbers, ask the user which one. Never open a chat by tapping a profile photo, avatar or picture: that opens the picture, not the chat. Only if the action says the contact was not found, fall back to the app: search the name, tap the row with the NAME text (not the photo), and only inside the chat (name at the top and a message box) type the message and tap Send. After type, the result shows what the field now contains; check it.
          8. Questions about a place, route or distance: use maps with route true, then read the distance and time from the screen and put them in done.message.
          9. Wi-Fi, Bluetooth, location, hotspot, airplane mode: use open_settings with the page, then tap the toggle on that screen and check the (checked) state changed.
          10. Before done, verify from the screen list. A play task needs a player on screen (play or pause control, seek bar, video title). A search task needs results on screen. A message task needs the text sent or in the box. If you cannot see proof, do one more check action. If you still cannot confirm, call done with ok false and say honestly what you could not confirm. Never claim a success you cannot see.
          11. Direct actions report their result in ACTIONS SO FAR. If it already shows success, call done; never run the same direct action twice. If it says permission missing or not found, call done with ok false and tell the user.
          12. Never pay, transfer money, delete data, uninstall or buy anything unless the CURRENT TASK says exactly that.
          13. done.message is one short sentence in Roman Urdu (Latin letters). done.speak is the same sentence in Hindi Devanagari script (Islamic words spelled properly). done.ok is true only when the task is really finished.
          14. A button that sends, likes, subscribes, follows, shares, saves, downloads, posts, plays or pauses is pressed at most ONCE per task. After pressing it, check the screen and call done. Pressing it again undoes it or sends a second copy.
          15. A photo or video to a person: take it first (open_app Camera, tap the shutter button), then call share_latest. Never try to send it by tapping around inside WhatsApp.
          16. A voice note: whatsapp_chat without text, then find the microphone button (labelled Voice message) on the screen and hold on it for the seconds the user wants. Do not use say or wait while recording. After hold, check the screen and call done.
          17. Reacting to a message (heart, like and so on): long_press the message bubble, then tap the emoji on the bar that appears (the heart is the red one).
          18. Never promise to tell the user later: you cannot speak after done. For long work (an AI app making an image, a download, an upload, a render) do the steps (open the app, type the request, press send once), then use watch with text describing the FINISHED result (for example "the generated image is shown"), never a button that exists while it is still working, then look at the result on screen and call done with what it shows. Do not call done before the work is really finished unless watch timed out.
          19. If the user asks you to do something inside another AI app (Gemini, ChatGPT, Claude, Meta AI), open it, type the request in its message box, press its send button once, then watch.
          20. Opening an app is done once per task. If you already opened it, never open it again: look at the screen and work from there.
          21. Alarm, reminder or timer: use alarm or timer at once, using NOW to work out the clock time ("in 20 minutes" means NOW plus 20 minutes; "morning" without an hour means 7). They are direct actions: after one succeeds call done.
          22. Questions about what is on the screen (read this, translate this, what does this say): answer from SCREEN ELEMENTS in done.message and done.speak, no other action. If the answer needs the actual picture (what is in this photo or image), use look first.
          23. Reading notifications: use notifications, then read the shade from SCREEN ELEMENTS and put the senders and messages in done.message, then use back. Replying to a notification: tap the notification row, then work inside that app.
          24. Output only the JSON object and nothing else.
          """

              private val ACTIONS = listOf(
                  "flashlight", "open_app", "youtube_search", "web_search", "maps", "open_settings", "call",
                  "call_contact", "whatsapp_chat", "send_sms", "share_latest", "long_press", "hold", "watch", "alarm", "timer", "look",
                  "volume", "brightness", "lock_screen", "screenshot", "quick_settings",
                  "tap", "type", "enter", "scroll", "back", "home", "recents", "notifications",
                  "wait", "say", "done"
              )

              @Volatile
              private var aborted = false

              @Volatile
              private var conn: HttpURLConnection? = null

              /** STOP: cut the running network call at once so MJ stops without waiting. */
              fun abort() {
                  aborted = true
                  try {
                      conn?.disconnect()
                  } catch (e: Exception) {
                  }
              }

              fun reset() {
                  aborted = false
              }

              /** Set by MJService so network trouble shows in the log. */
              @Volatile
              var onLog: ((String) -> Unit)? = null

              @Volatile
              private var slowNet = false

              private class SchemaRejected : RuntimeException()
              private class Retry(msg: String) : RuntimeException(msg)

              // ---------------------------------------------------------------- schemas

              private fun str() = JSONObject().put("type", "STRING")
              private fun int() = JSONObject().put("type", "INTEGER")
              private fun bool() = JSONObject().put("type", "BOOLEAN")

              private fun actionSchema(): JSONObject {
                  val props = JSONObject()
                      .put("action", JSONObject().put("type", "STRING").put("enum", JSONArray(ACTIONS)))
                      .put("id", int())
                      .put("text", str())
                      .put("name", str())
                      .put("query", str())
                      .put("page", str())
                      .put("number", str())
                      .put("direction", str())
                      .put("on", bool())
                      .put("route", bool())
                      .put("seconds", int())
                      .put("hour", int())
                      .put("minute", int())
                      .put("level", int())
                      .put("ms", int())
                      .put("message", str())
                      .put("speak", str())
                      .put("ok", bool())
                  return JSONObject()
                      .put("type", "OBJECT")
                      .put("properties", props)
                      .put("required", JSONArray().put("action"))
              }

              private fun understandSchema(): JSONObject {
                  val props = JSONObject()
                      .put("heard", str())
                      .put("mode", JSONObject().put("type", "STRING").put("enum", JSONArray(listOf("tasks", "chat", "stop", "none"))))
                      .put("tasks", JSONObject().put("type", "ARRAY").put("items", str()))
                      .put("reply", str())
                      .put("speak", str())
                      .put("remember", str())
                  return JSONObject()
                      .put("type", "OBJECT")
                      .put("properties", props)
                      .put("required", JSONArray().put("heard").put("mode").put("reply").put("speak"))
              }

              private fun yesSchema(): JSONObject =
                  JSONObject()
                      .put("type", "OBJECT")
                      .put("properties", JSONObject().put("yes", bool()))
                      .put("required", JSONArray().put("yes"))

              private fun choiceSchema(): JSONObject =
                  JSONObject()
                      .put("type", "OBJECT")
                      .put("properties", JSONObject().put("choice", int()))
                      .put("required", JSONArray().put("choice"))

              private fun audioPart(wav: ByteArray): JSONObject =
                  JSONObject().put(
                      "inlineData",
                      JSONObject().put("mimeType", "audio/wav")
                          .put("data", Base64.encodeToString(wav, Base64.NO_WRAP))
                  )

              // ---------------------------------------------------------------- public

              /**
               * Understands one user turn. Give audio (wav) or text.
               * fromMic = the text came from a speech recogniser and may be misheard.
               */
              fun understand(
                  key: String,
                  model: String,
                  name: String,
                  wav: ByteArray?,
                  text: String?,
                  fromMic: Boolean,
                  chat: List<String>,
                  memory: String
              ): JSONObject {
                  val parts = JSONArray()
                  if (wav != null) parts.put(audioPart(wav))
                  val p = buildString {
                      append(memory).append("\n")
                      append("EARLIER CONVERSATION (oldest first):\n")
                      if (chat.isEmpty()) {
                          append("(none)\n")
                      } else {
                          for (c in chat.takeLast(8)) append(c).append("\n")
                      }
                      append("\n")
                      if (wav != null) {
                          append("The audio above is his latest message. Listen carefully and answer with the JSON object.")
                      } else if (fromMic) {
                          append("A speech recogniser heard this (it may be misheard, fix it by sound and meaning): ")
                          append(text).append("\nAnswer with the JSON object.")
                      } else {
                          append("He typed this latest message: ").append(text).append("\nAnswer with the JSON object.")
                      }
                  }
                  parts.put(JSONObject().put("text", p))
                  return post(key, model, understandSystem(name), parts, understandSchema())
              }

              /** Did the user clearly say yes? Used before irreversible work. */
              fun confirm(key: String, model: String, wav: ByteArray?, text: String?): Boolean {
                  val parts = JSONArray()
                  if (wav != null) parts.put(audioPart(wav))
                  val q = if (wav != null) {
                      "In the audio above, did the speaker clearly say yes (haan, ji, kar do, yes, theek hai, pakka, bilkul)?"
                  } else {
                      "He said: " + text + "\nDid he clearly say yes (haan, ji, kar do, yes, theek hai, pakka, bilkul)?"
                  }
                  parts.put(JSONObject().put("text", q + " Answer with JSON {\"yes\": true or false}. If unclear or no, answer false."))
                  val r = post(key, model, "You decide whether a person said yes. Output only JSON.", parts, yesSchema())
                  return r.optBoolean("yes", false)
              }

              /** Which of the options did the user choose? 0 = unclear. */
              fun choose(key: String, model: String, wav: ByteArray?, text: String?, options: List<String>): Int {
                  val parts = JSONArray()
                  if (wav != null) parts.put(audioPart(wav))
                  val list = options.mapIndexed { i, o -> "" + (i + 1) + ") " + o }.joinToString("\n")
                  val lead = if (wav != null) "In the audio above, " else "He said: " + text + "\nFrom that, "
                  val q = lead + "which option did the speaker choose?\n" + list + "\n" +
                      "Accept pehla/first/ek/1, doosra/second/do/2, teesra/third/teen/3 and so on, or the name, " +
                      "the type (mobile, home) or the last digits. " +
                      "Answer with JSON {\"choice\": number}. Use 0 if unclear."
                  parts.put(JSONObject().put("text", q))
                  val r = post(key, model, "You pick which option a person chose. Output only JSON.", parts, choiceSchema())
                  return r.optInt("choice", 0)
              }

              /** After the model says done: does the screen really show that the task is finished? */
              fun verify(key: String, model: String, task: String, claimed: String, actions: List<String>, snap: ScreenSnapshot): Boolean {
                  val q = "TASK: " + task + "\nWHAT MJ CLAIMS: " + claimed + "\nACTIONS TAKEN:\n" +
                      actions.takeLast(8).joinToString("\n") { "- $it" } +
                      "\nCURRENT APP: " + snap.pkg + "\nSCREEN ELEMENTS:\n" + snap.text +
                      "\nDoes the screen (or the action results) really show that the task is finished? " +
                      "Judge only from evidence. A message in the box but not sent is not finished. " +
                      "A search page is not a playing video. Answer with JSON {\"yes\": true or false}."
                  val parts = JSONArray().put(JSONObject().put("text", q))
                  val r = post(key, model, "You are a strict checker of phone tasks. Output only JSON.", parts, yesSchema())
                  return r.optBoolean("yes", false)
              }

              /** A vision answer about a screenshot. */
              fun look(key: String, model: String, question: String, jpeg: ByteArray): String {
                  val img = JSONObject().put(
                      "inlineData",
                      JSONObject().put("mimeType", "image/jpeg").put("data", Base64.encodeToString(jpeg, Base64.NO_WRAP))
                  )
                  val parts = JSONArray().put(img).put(
                      JSONObject().put(
                          "text",
                          "Question about this phone screen: " + question +
                              "\nAnswer in 1 to 3 short sentences in Roman Urdu (Latin letters). Answer with JSON {\"answer\": text}."
                      )
                  )
                  val schema = JSONObject().put("type", "OBJECT")
                      .put("properties", JSONObject().put("answer", str()))
                      .put("required", JSONArray().put("answer"))
                  val r = post(key, model, "You look at a phone screenshot and answer the question. Output only JSON.", parts, schema)
                  return r.optString("answer", "")
              }

              /** Is the thing we are waiting for visible on this screen yet? */
              fun check(key: String, model: String, what: String, snap: ScreenSnapshot): Boolean {
                  val q = "WAITING FOR: " + what + "\nCURRENT APP: " + snap.pkg + "\nSCREEN ELEMENTS:\n" + snap.text +
                      "\nIs it finished and visible on the screen now? Still loading, generating, thinking, uploading or showing a stop button means false. " +
                      "Answer with JSON {\"yes\": true or false}."
                  val parts = JSONArray().put(JSONObject().put("text", q))
                  val r = post(key, model, "You check whether a long task on a phone screen has finished. Output only JSON.", parts, yesSchema())
                  return r.optBoolean("yes", false)
              }

              /** Picks the single next action for the current task. */
              fun decide(
                  key: String,
                  model: String,
                  task: String,
                  before: List<String>,
                  after: List<String>,
                  history: List<String>,
                  snap: ScreenSnapshot
              ): JSONObject {
                  val prompt = buildString {
                      append("NOW: ").append(java.text.SimpleDateFormat("EEEE d MMM yyyy, HH:mm", java.util.Locale.ENGLISH).format(java.util.Date())).append("\n")
                      append("CURRENT TASK: ").append(task).append("\n")
                      append("ALREADY DONE (do not repeat): ")
                      append(if (before.isEmpty()) "(none)" else before.joinToString("; ")).append("\n")
                      append("LEFT FOR LATER (do NOT do now): ")
                      append(if (after.isEmpty()) "(none)" else after.joinToString("; ")).append("\n\n")
                      append("CURRENT APP: ").append(snap.pkg).append("\n")
                      append("SCREEN ELEMENTS:\n").append(snap.text).append("\n")
                      append("ACTIONS SO FAR:\n")
                      if (history.isEmpty()) {
                          append("(none)\n")
                      } else {
                          for (h in history.takeLast(8)) append("- ").append(h).append("\n")
                      }
                      append("\nReply with the single next action as a flat JSON object.")
                  }
                  val parts = JSONArray().put(JSONObject().put("text", prompt))
                  return post(key, model, SYSTEM, parts, actionSchema())
              }

              /** Fields of the action, whether the model sent them flat or inside an "args" object. */
              fun args(reply: JSONObject): JSONObject {
                  val out = JSONObject()
                  val keys = reply.keys()
                  while (keys.hasNext()) {
                      val k = keys.next()
                      if (k != "action" && k != "args") out.put(k, reply.get(k))
                  }
                  val inner = reply.optJSONObject("args")
                  if (inner != null) {
                      val innerKeys = inner.keys()
                      while (innerKeys.hasNext()) {
                          val k = innerKeys.next()
                          out.put(k, inner.get(k))
                      }
                  }
                  return out
              }

              // ---------------------------------------------------------------- network

              private fun post(
                  key: String,
                  model: String,
                  system: String,
                  parts: JSONArray,
                  schema: JSONObject?
              ): JSONObject {
                  var useSchema = schema != null
                  var last: Exception? = null
                  var useModel = model
                  for (attempt in 0..3) {
                      if (aborted) throw RuntimeException("roka gaya")
                      try {
                          return postOnce(key, useModel, system, parts, if (useSchema) schema else null)
                      } catch (e: SchemaRejected) {
                          useSchema = false
                          last = e
                      } catch (e: Retry) {
                          last = e
                          onLog?.invoke("Net/AI dobara koshish ${attempt + 1}: ${e.message}")
                          if (attempt >= 1 && useModel == model) {
                              useModel = if (model.contains("lite")) "gemini-flash-latest" else "gemini-flash-lite-latest"
                              onLog?.invoke("Doosra model try kar rahi hoon: $useModel")
                          }
                          Thread.sleep(500L * (attempt + 1))
                      } catch (e: java.io.IOException) {
                          if (aborted) throw RuntimeException("roka gaya")
                          last = e
                          slowNet = true
                          if (attempt >= 1) throw RuntimeException("Net bohat slow ya atka hua hai, thori der baad try karein")
                          onLog?.invoke("Net atak gaya (${e.javaClass.simpleName}), nayi connection se dobara koshish ${attempt + 1}")
                      }
                  }
                  throw RuntimeException(last?.message ?: "AI error")
              }

              private fun postOnce(
                  key: String,
                  model: String,
                  system: String,
                  parts: JSONArray,
                  schema: JSONObject?
              ): JSONObject {
                  val gen = JSONObject().put("temperature", 0).put("responseMimeType", "application/json")
                  if (schema != null) gen.put("responseSchema", schema)

                  val body = JSONObject()
                      .put(
                          "systemInstruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", system)))
                      )
                      .put(
                          "contents",
                          JSONArray().put(JSONObject().put("role", "user").put("parts", parts))
                      )
                      .put("generationConfig", gen)

                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
                  val c = url.openConnection() as HttpURLConnection
                  conn = c
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = 8000
                      c.readTimeout = 20000
                      if (slowNet) {
                          c.setRequestProperty("Connection", "close")
                          c.useCaches = false
                      }
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("x-goog-api-key", key)
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream.bufferedReader().use { it.readText() }
                      if (code !in 200..299) {
                          if (code == 400 && schema != null && text.contains("schema", ignoreCase = true)) {
                              throw SchemaRejected()
                          }
                          if (code == 500 || code == 503) throw Retry("HTTP $code")
                          val hint = when (code) {
                              400 -> "API key ya model ka naam galat ho sakta hai"
                              404 -> "model ka naam galat hai, gemini-flash-lite-latest try karein"
                              429 -> "free limit poori, thori der baad try karein"
                              else -> ""
                          }
                          throw RuntimeException("HTTP $code $hint ${text.take(150)}")
                      }
                      val out = JSONObject(text)
                          .getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                          .getString("text")
                      val cleaned = out.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                      return JSONObject(cleaned)
                  } finally {
                      // no disconnect(): the connection stays open and is reused, which saves time on slow networks
                  }
              }
          }
