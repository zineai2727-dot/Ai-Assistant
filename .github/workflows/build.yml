          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.math.abs
          import kotlin.math.max

          /**
           * MJ's body: an accessibility service that can read the screen and act on it.
           *
           * One turn:
           *   1. hear: record the voice. If a Vosk model is installed it also listens offline in parallel.
           *   2. simple commands (flashlight, volume, brightness, home, back, lock, open app...) run at once,
           *      offline, without the internet.
           *   3. everything else: the audio itself goes to Gemini, which returns a chat reply or a list of tasks.
           *   4. every task runs on its own, one screen step at a time, with guards against repeating.
           *   5. speak the result, then listen again until the user says bas or stays silent.
           */
          class MJService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: MJService? = null
                  val logs = ArrayList<String>()

                  @Volatile
                  var sink: ((String) -> Unit)? = null

                  private val SENSITIVE = listOf(
                      "pay", "send money", "transfer", "delete", "uninstall",
                      "purchase", "buy", "erase", "factory reset", "remove account"
                  )

                  private val RISKY = Regex(
                      "delete|remove|erase|uninstall|format|factory|reset|unsend|\\bpay\\b|send money|transfer|purchase|\\bbuy\\b"
                  )

                  private val AUTO = setOf("call_contact", "send_sms", "share_latest", "alarm", "timer", "call")

                  private val ONCE = setOf(
                      "youtube_search", "web_search", "maps", "whatsapp_chat", "call_contact",
                      "send_sms", "share_latest", "call", "alarm", "timer"
                  )

                  private val DIRECT = setOf(
                      "flashlight", "open_app", "youtube_search", "web_search", "call", "volume", "brightness",
                      "maps", "open_settings", "lock_screen", "screenshot", "quick_settings",
                      "call_contact", "whatsapp_chat", "send_sms", "share_latest", "alarm", "timer"
                  )

                  /** While voice notes or media play or record, MJ must stay silent. */
                  private val QUIET = Regex(
                      "voice|वॉइस|वाइस|वॉयस|record|रिकॉर्ड|song|गाना|gana|music|म्यूज़िक|म्यूजिक|video|वीडियो|reel|रील|audio|ऑडियो"
                  )

                  /** Buttons that must be pressed only once per task: pressing again undoes or duplicates them. */
                  private val TOGGLERS = Regex(
                      "\\b(send|like|liked|dislike|subscribe|subscribed|follow|following|share|save|download|post|play|pause|mute|unmute)\\b"
                  )

                  private val EMPTY = ScreenSnapshot("", emptyList(), 0, "")
              }

              private class TaskResult(val ok: Boolean, val msg: String, val speak: String)

              private enum class Mode { IDLE, LISTEN, WORK }

              private val ui = Handler(Looper.getMainLooper())

              @Volatile
              private var cancelled = false
              private val busy = AtomicBoolean(false)
              private val chat = ArrayList<String>()
              private val smsSent = HashSet<String>()
              private val taskTaps = HashSet<String>()

              @Volatile
              private var quietNow = false

              @Volatile
              private var aiKey = ""

              @Volatile
              private var aiModel = ""

              private var overlay: LinearLayout? = null
              private var statusView: TextView? = null
              private var bubble: TextView? = null
              private var bubbleBg: GradientDrawable? = null
              private var recognizer: SpeechRecognizer? = null

              private var tts: TextToSpeech? = null

              @Volatile
              private var speakLatch: CountDownLatch? = null

              @Volatile
              private var speakId = ""
              private var speakCounter = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          try {
                              val r = tts?.setLanguage(Locale("hi", "IN"))
                              if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                                  tts?.setLanguage(Locale.getDefault())
                              }
                          } catch (e: Exception) {
                          }
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}

                              override fun onDone(utteranceId: String?) {
                                  if (utteranceId == speakId) speakLatch?.countDown()
                              }

                              override fun onError(utteranceId: String?) {
                                  if (utteranceId == speakId) speakLatch?.countDown()
                              }
                          })
                      }
                  }
                  refreshBubble()
                  emit("MJ service ON")
                  if (getSharedPreferences("mj", MODE_PRIVATE).getBoolean("wake", false)) {
                      emit("Wake word ON hai (app kholein, Save dabayein agar sun nahi rahi)")
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  cancelled = true
                  hideBubble()
                  ui.post {
                      try {
                          recognizer?.destroy()
                      } catch (e: Exception) {
                      }
                  }
                  tts?.shutdown()
                  return super.onUnbind(intent)
              }

              // ------------------------------------------------------------------ public

              fun isBusy(): Boolean = busy.get()

              /** A typed command (one turn, no listening afterwards). */
              fun runCommand(text: String) {
                  start { turn(null, text, false, false) }
              }

              /** Bubble / mic button / wake word: starts a spoken conversation, or stops it if one is running. */
              fun startConversation() {
                  if (busy.get()) {
                      stopAll()
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      emit("Mic permission nahi hai: MJ app mein '4) Mic permission' dabayein")
                      ui.post {
                          Toast.makeText(this, "Mic permission allow karein (MJ app kholein)", Toast.LENGTH_LONG).show()
                      }
                      return
                  }
                  start { conversation() }
              }

              fun refreshBubble() {
                  if (getSharedPreferences("mj", MODE_PRIVATE).getBoolean("bubble", true)) showBubble() else hideBubble()
              }

              // ------------------------------------------------------------------ run control

              private fun start(body: () -> Unit) {
                  if (!busy.compareAndSet(false, true)) {
                      emit("MJ pehle se kaam kar rahi hai")
                      return
                  }
                  cancelled = false
                  Brain.reset()
                  Thread {
                      try {
                          body()
                      } catch (e: Exception) {
                          emit("Error: ${e.message}")
                      } finally {
                          busy.set(false)
                          hideOverlay()
                          setBubble(Mode.IDLE)
                      }
                  }.start()
              }

              private fun stopAll() {
                  cancelled = true
                  Brain.abort()
                  emit("STOP dabaya")
                  setStatus("Roka gaya")
                  tts?.stop()
                  speakLatch?.countDown()
              }

              // ------------------------------------------------------------------ conversation

              private fun conversation() {
                  showOverlay()
                  var silent = 0
                  var first = true
                  var useGoogle = false
                  while (!cancelled) {
                      setBubble(Mode.LISTEN)
                      setStatus("Boliye...")
                      var wav: ByteArray? = null
                      var gtext: String? = null
                      var offline = ""

                      if (!useGoogle) {
                          val vs = if (getSharedPreferences("mj", MODE_PRIVATE).getBoolean("offlineCmd", false)) VoskHelper.session(this) else null
                          val feed: ((ShortArray, Int) -> Unit)? = if (vs != null) vs::feed else null
                          val rec = Recorder.record(if (first) 7000L else 9000L, feed) { cancelled }
                          if (vs != null) offline = vs.finish()
                          if (rec.wav != null) emit("Awaaz record hui: " + Recorder.lastInfo)
                          if (rec.blocked) {
                              useGoogle = true
                              emit("Android background mein mic block kar raha hai, Google mic use kar rahi hoon")
                          } else {
                              wav = rec.wav
                          }
                      }
                      if (useGoogle) gtext = listenGoogle()
                      first = false
                      if (cancelled) break

                      if (wav == null && gtext.isNullOrBlank()) {
                          silent++
                          if (silent >= 2) {
                              finish(
                                  "Koi awaaz nahi aayi, main yahin hoon. Jab chahein bula lein",
                                  "कोई आवाज़ नहीं आई, मैं यहीं हूँ। जब चाहें बुला लीजिए।"
                              )
                              break
                          }
                          continue
                      }
                      silent = 0

                      // simple commands: offline and instant
                      val heardText = if (wav != null) offline else (gtext ?: "")
                      if (heardText.isNotBlank()) {
                          setBubble(Mode.WORK)
                          val torch = fastTorch(heardText, true)
                          if (torch != null) {
                              emit("Suna (offline): $heardText")
                              finish(torch.msg, torch.speak)
                              continue
                          }
                          val lc = Local.parse(heardText)
                          if (lc != null) {
                              runLocal(lc, heardText)
                              continue
                          }
                      }

                      setBubble(Mode.WORK)
                      if (!turn(wav, gtext, true, gtext != null)) break
                  }
                  synchronized(chat) { chat.clear() }
              }

              private fun runLocal(c: Local.Cmd, heard: String) {
                  emit("Suna (offline): $heard")
                  val r = execute(c.action, c.args, EMPTY, heard)
                  if (failed(r)) finish(r) else finish(c.msg, c.speak)
              }

              /** Fallback when Android blocks direct mic recording: Google's recogniser gives text instead. */
              private fun listenGoogle(): String? {
                  val latch = CountDownLatch(1)
                  var result: String? = null
                  ui.post {
                      try {
                          if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                              emit("Is phone par speech recognition nahi mila")
                              latch.countDown()
                              return@post
                          }
                          recognizer?.destroy()
                          val r = SpeechRecognizer.createSpeechRecognizer(this)
                          recognizer = r
                          r.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {}
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}

                              override fun onError(error: Int) {
                                  latch.countDown()
                              }

                              override fun onResults(results: Bundle?) {
                                  result = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  latch.countDown()
                              }
                          })
                          val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          r.startListening(i)
                      } catch (e: Exception) {
                          latch.countDown()
                      }
                  }
                  try {
                      latch.await(20, TimeUnit.SECONDS)
                  } catch (e: InterruptedException) {
                  }
                  ui.post {
                      try {
                          recognizer?.destroy()
                      } catch (e: Exception) {
                      }
                      recognizer = null
                  }
                  return result
              }

              // ------------------------------------------------------------------ one turn

              /** Returns true if the conversation should go on listening. */
              private fun turn(wav: ByteArray?, text: String?, convo: Boolean, fromMic: Boolean): Boolean {
                  showOverlay()
                  smsSent.clear()
                  quietNow = false
                  val prefs = getSharedPreferences("mj", MODE_PRIVATE)
                  val key = prefs.getString("key", "") ?: ""
                  val model = (prefs.getString("model", "") ?: "").ifEmpty { Brain.DEFAULT_MODEL }
                  val name = (prefs.getString("name", "") ?: "").ifBlank { "Waqas" }
                  val agentModel = (prefs.getString("model2", "") ?: "").ifBlank { model }
                  aiKey = key
                  aiModel = model
                  Brain.onLog = { m -> emit(m) }
                  val tU = System.currentTimeMillis()

                  if (text != null) {
                      setStatus("MJ: $text")
                      emit("Command: $text")
                      if (!fromMic) {
                          val quick = fastTorch(text, true)
                          if (quick != null) {
                              finish(quick.msg, quick.speak)
                              return false
                          }
                          val lc = Local.parse(text)
                          if (lc != null) {
                              runLocal(lc, text)
                              return false
                          }
                      }
                  }

                  if (key.isBlank()) {
                      finish("Pehle app mein Gemini API key save karein", "पहले ऐप में जेमिनी की सेट कीजिए।")
                      return false
                  }
                  if (text == null) setStatus("Samajh rahi hoon...")

                  val history = synchronized(chat) { ArrayList(chat) }
                  val u = try {
                      Brain.understand(key, model, name, wav, text, fromMic, history, Memory.context(this))
                  } catch (e: Exception) {
                      finish("AI error: ${e.message}")
                      return false
                  }

                  val dU = System.currentTimeMillis() - tU
                  if (dU > 5000) emit("Samajhne mein ${dU / 1000} second lage (net ya AI slow)")
                  val heard = u.optString("heard").ifBlank { text ?: "" }
                  val mode = u.optString("mode")
                  val reply = u.optString("reply").ifBlank { "Ji" }
                  val remember = u.optString("remember").trim()
                  if (remember.isNotEmpty()) {
                      Memory.addNote(this, remember)
                      emit("Yaad rakh liya: $remember")
                  }
                  val spoken = u.optString("speak").ifBlank { reply }
                  if (wav != null) emit("Suna (Gemini ne awaaz se): $heard")
                  else if (fromMic) emit("Suna (Google mic se): $heard")
                  if (heard.isNotBlank()) addChat("$name: $heard")

                  if (mode == "none") {
                      finish("Samajh nahi aaya, dobara boliye", "माफ़ कीजिए, समझ नहीं आया। फिर से बोलिए।")
                      return true
                  }
                  if (mode == "stop") {
                      addChat("MJ: $reply")
                      finish(reply, spoken)
                      return false
                  }

                  val tasks = ArrayList<String>()
                  val arr = u.optJSONArray("tasks")
                  if (mode == "tasks" && arr != null) {
                      for (i in 0 until minOf(arr.length(), 6)) {
                          val t = arr.optString(i).trim()
                          if (t.isNotEmpty()) tasks.add(t)
                      }
                  }
                  if (tasks.isEmpty()) {
                      addChat("MJ: $reply")
                      finish(reply, spoken)
                      return true
                  }

                  if (tasks.any { RISKY.containsMatchIn(it.lowercase()) }) {
                      if (!convo) {
                          finish(
                              "Yeh kaam wapas nahi ho sakta, is liye sirf mic se bolkar karein",
                              "यह काम वापस नहीं हो सकता, इसलिए माइक से बोलकर कीजिए।"
                          )
                          return false
                      }
                      if (!confirmRisky(key, model)) {
                          finish("Theek hai, maine woh kaam nahi kiya", "ठीक है, मैंने वह काम नहीं किया।")
                          return true
                      }
                  }

                  quietNow = QUIET.containsMatchIn((heard + " " + tasks.joinToString(" ")).lowercase())
                  emit("MJ: $reply")
                  setStatus(reply)
                  addChat("MJ: kaam shuru kiye: " + tasks.joinToString(" | "))
                  if (!quietNow) speak(spoken, false)

                  val results = ArrayList<TaskResult>()
                  for ((i, t) in tasks.withIndex()) {
                      if (cancelled) break
                      emit("Kaam ${i + 1}/${tasks.size}: $t")
                      setStatus("Kaam ${i + 1}/${tasks.size}: $t")
                      val before = results.mapIndexed { j, r -> tasks[j] + " -> " + r.msg }
                      val after = tasks.drop(i + 1)
                      val tr = runTask(t, heard, key, agentModel, before, after)
                      results.add(tr)
                      Memory.addWork(this, t, tr.ok && !cancelled, tr.msg)
                  }
                  if (cancelled) {
                      for (j in results.size until tasks.size) Memory.addWork(this, tasks[j], false, "roka gaya, shuru nahi hua")
                      finish("Roka gaya (stopped)")
                      return false
                  }

                  val msg = results.joinToString("  |  ") { it.msg }
                  val say = results.joinToString("। ") { it.speak }.trim()
                  addChat("MJ: $msg")
                  if (quietNow) {
                      finish(msg, "")
                      quietNow = false
                      return false
                  }
                  val tail = if (convo) " और कोई काम?" else ""
                  finish(msg, if (say.isBlank()) "" else say + tail)
                  return true
              }

              private fun addChat(line: String) {
                  synchronized(chat) {
                      chat.add(line)
                      while (chat.size > 12) chat.removeAt(0)
                  }
              }

              // ------------------------------------------------------------------ one task

              private fun runTask(
                  task: String,
                  request: String,
                  key: String,
                  model: String,
                  before: List<String>,
                  after: List<String>
              ): TaskResult {
                  val quick = fastTorch(task, false)
                  if (quick != null) return quick

                  // simple tasks need no AI at all
                  val lt = Local.parseTask(task)
                  if (lt != null) {
                      val r = execute(lt.action, lt.args, EMPTY, request)
                      settle(lt.action)
                      return if (failed(r)) TaskResult(false, r, "") else TaskResult(true, lt.msg, lt.speak)
                  }

                  taskTaps.clear()
                  val history = ArrayList<String>()
                  val recent = ArrayList<String>()
                  var lastSig = ""
                  var lastResult = ""
                  var prevHash = 0
                  var prevUi = false
                  var forced = false
                  val stuckMsg = "Atak gayi: '$task' mein wahi action baar baar aa raha tha, ruk gayi"
                  val stuckSpeak = "मैं इस काम में अटक गई, इसलिए रुक गई।"

                  for (step in 1..18) {
                      if (cancelled) return TaskResult(false, "Roka gaya (stopped)", "")
                      var root = rootInActiveWindow
                      if (root == null) {
                          Thread.sleep(400)
                          root = rootInActiveWindow
                      }
                      val snap = ScreenReader.read(root)

                      if (prevUi && history.isNotEmpty() && snap.hash == prevHash) {
                          history[history.size - 1] = history.last() + " (screen did not change)"
                      }

                      setStatus("$task (step $step, AI soch rahi hai)")
                      val t0 = System.currentTimeMillis()
                      val reply = try {
                          Brain.decide(key, model, task, before, after, history, snap)
                      } catch (e: Exception) {
                          return TaskResult(false, "AI error: ${e.message}", "")
                      }
                      val dt = System.currentTimeMillis() - t0
                      if (dt > 6000) emit("Net slow hai: AI ne ${dt / 1000} second liye")
                      val action = reply.optString("action")
                      val args = Brain.args(reply)

                      if (action == "done") {
                          val m = args.optString("message", "").ifBlank { args.optString("text", "") }.ifBlank { "Ho gaya" }
                          val s = args.optString("speak", "").ifBlank { m }
                          var okDone = args.optBoolean("ok", true)
                          if (okDone) {
                              val lt = task.lowercase()
                              val sc = snap.text.lowercase()
                              val wantsPlay = Regex("play|चला|chala|sun|सुन|song|गाना|gana|video|वीडियो").containsMatchIn(lt)
                              val proof = Regex("pause|seek|minimi|fullscreen|full screen|next|previous|autoplay|like|subscribe|progress").containsMatchIn(sc)
                              val last = history.lastOrNull() ?: ""
                              if (wantsPlay && snap.pkg.contains("youtube") && !proof) okDone = false
                              else if (last.startsWith("tap") && last.contains("screen did not change")) okDone = false
                          }
                          val uiWork = history.any { it.startsWith("tap") || it.startsWith("type") || it.startsWith("enter") || it.startsWith("hold") || it.startsWith("long_press") }
                          if (okDone && uiWork && !history.any { it.contains("SCREEN ANSWER") }) {
                              setStatus("$task: check kar rahi hoon...")
                              val real = try {
                                  Brain.verify(key, model, task, m, history, snap)
                              } catch (e: Exception) {
                                  true
                              }
                              if (!real) {
                                  return TaskResult(false, "Pakka nahi ke '$task' poora hua: screen par saboot nahi dikha, aap ek nazar dekh lein", "मुझे पक्का नहीं कि काम पूरा हुआ, आप एक नज़र देख लीजिए।")
                              }
                          }
                          if (!okDone && args.optBoolean("ok", true)) {
                              return TaskResult(false, "Pakka nahi ke '$task' hua ya nahi: screen par saboot nahi dikha, aap ek nazar dekh lein", "मुझे पक्का नहीं कि काम हुआ या नहीं, आप एक नज़र देख लीजिए।")
                          }
                          return TaskResult(okDone, m, s)
                      }

                      // the same action again and again, whatever the screen looks like
                      val same = action + args.toString()
                      val limit = if (action == "scroll" || action == "wait") 5 else 3
                      if (recent.takeLast(10).count { it == same } >= limit) {
                          return TaskResult(false, stuckMsg, stuckSpeak)
                      }
                      recent.add(same)

                      // the same action on a screen that did not change
                      val sig = same + snap.hash
                      if (sig == lastSig) {
                          if (action in DIRECT && !failed(lastResult)) {
                              return TaskResult(true, "Ho gaya ($lastResult)", "हो गया।")
                          }
                          if (action == "tap" && !forced) {
                              forced = true
                              val r = tapGesture(args.optInt("id", -1), snap)
                              history.add("$action $args -> first click did nothing, used a real touch: $r")
                              emit("Step $step: real touch tap $args")
                              prevUi = true
                              prevHash = snap.hash
                              settle("tap")
                              continue
                          }
                          return TaskResult(false, stuckMsg, stuckSpeak)
                      }
                      forced = false
                      lastSig = sig

                      if (action in ONCE && history.any { it.startsWith(action) && !failed(it) }) {
                          history.add("$action $args -> BLOCKED: already done once in this task, look at the screen and call done")
                          continue
                      }
                      if (action == "open_app" && history.any { it.startsWith("open_app") }) {
                          history.add("open_app $args -> BLOCKED: app already opened in this task, work on the current screen")
                          continue
                      }
                      if (action == "watch") {
                          val what = args.optString("text", "the work to finish").ifBlank { "the work to finish" }
                          val maxS = args.optInt("seconds", 120).coerceIn(10, 600)
                          emit("Step $step: watch '$what' (max $maxS s)")
                          val end = System.currentTimeMillis() + maxS * 1000L
                          var seen = false
                          while (System.currentTimeMillis() < end && !cancelled) {
                              var w = 0
                              while (w < 12 && !cancelled) {
                                  Thread.sleep(500)
                                  w++
                              }
                              if (cancelled) break
                              val left = ((end - System.currentTimeMillis()) / 1000).toInt()
                              setStatus("Intezaar: $what ($left s baqi)")
                              val s2 = ScreenReader.read(rootInActiveWindow)
                              val ok = try {
                                  Brain.check(key, model, what, s2)
                              } catch (e: Exception) {
                                  false
                              }
                              if (ok) {
                                  seen = true
                                  break
                              }
                          }
                          history.add("watch '$what' -> " + if (seen) "finished, look at the screen now" else "timed out, not finished")
                          prevUi = false
                          prevHash = 0
                          lastSig = ""
                          continue
                      }
                      emit("Step $step: $action $args")
                      setStatus("$task (step $step)")

                      val result = execute(action, args, snap, request)
                      lastResult = result
                      history.add("$action $args -> $result")
                      val autoDone = action in AUTO || (action == "whatsapp_chat" && args.optString("text").isNotBlank())
                      if (autoDone && !result.contains("BLOCKED")) {
                          val ok = !failed(result)
                          return TaskResult(ok, if (ok) "Ho gaya ($result)" else result, if (ok) "हो गया।" else "")
                      }
                      prevUi = action == "tap" || action == "type" || action == "scroll" || action == "enter"
                      prevHash = snap.hash
                      settle(action)
                  }
                  return TaskResult(false, "'$task' poora nahi ho saka (18 step ho gaye)", "यह काम पूरा नहीं हो पाया।")
              }

              private fun failed(r: String): Boolean {
                  val s = r.lowercase()
                  return s.contains("not found") || s.contains("error") || s.contains("failed") ||
                      s.contains("nahi") || s.contains("blocked") || s.contains("cannot") || s.startsWith("bad ")
              }

              /** Asks (by voice) before irreversible work. Only a clear yes continues. */
              private fun confirmRisky(key: String, model: String): Boolean {
                  setBubble(Mode.LISTEN)
                  finish(
                      "Yeh kaam wapas nahi ho sakta. Pakka? 'Haan' boliye",
                      "यह काम वापस नहीं हो सकता। क्या आप पक्का चाहते हैं? हाँ बोलिए।"
                  )
                  if (cancelled) return false
                  setStatus("Haan ya na boliye...")
                  val rec = Recorder.record(8000L) { cancelled }
                  var answer = false
                  val w = rec.wav
                  if (w != null) {
                      answer = try {
                          Brain.confirm(key, model, w, null)
                      } catch (e: Exception) {
                          false
                      }
                  } else if (rec.blocked) {
                      val t = listenGoogle()
                      if (!t.isNullOrBlank()) {
                          answer = try {
                              Brain.confirm(key, model, null, t)
                          } catch (e: Exception) {
                              false
                          }
                      }
                  }
                  setBubble(Mode.WORK)
                  return answer
              }

              /** Several contacts or numbers match: show them on the screen only, then listen for the choice. */
              private fun chooseContact(cands: List<Contact>): Contact? {
                  val descs = cands.map { Device.describeFull(it) }
                  emit("MJ: Kai number mile, kaun sa?")
                  descs.forEachIndexed { i, d -> emit("${i + 1}) $d") }
                  val shown = descs.mapIndexed { i, d -> "${i + 1}) $d" }.joinToString("\n")
                  val spoken = "कई नंबर मिले। स्क्रीन देखिए, कौन सा?"
                  for (attempt in 1..2) {
                      setBubble(Mode.LISTEN)
                      setStatus("Kaun sa? (pehla / doosra / teesra...)\n$shown")
                      if (voiceOn()) speak(spoken, true)
                      if (cancelled) return null
                      val rec = Recorder.record(9000L) { cancelled }
                      var idx = 0
                      val w = rec.wav
                      if (w != null) {
                          idx = try {
                              Brain.choose(aiKey, aiModel, w, null, descs)
                          } catch (e: Exception) {
                              0
                          }
                      } else if (rec.blocked) {
                          val t = listenGoogle()
                          if (!t.isNullOrBlank()) {
                              idx = try {
                                  Brain.choose(aiKey, aiModel, null, t, descs)
                              } catch (e: Exception) {
                                  0
                              }
                          }
                      }
                      setBubble(Mode.WORK)
                      if (idx in 1..cands.size) return cands[idx - 1]
                      if (cancelled) return null
                  }
                  return null
              }

              /** Call, WhatsApp chat or SMS to a person from the contacts. */
              private fun contactAction(a: JSONObject, kind: String): String {
                  val name = a.optString("name").trim()
                  var number = a.optString("number").trim()
                  if (number.filter { it.isDigit() }.length < 7) number = ""
                  val text = a.optString("text")
                  if (kind == "share" && Regex("view once|view-once|ek baar|एक बार").containsMatchIn(text.lowercase())) {
                      return "view once abhi MJ se nahi lag sakta, isliye bheji nahi; normal photo ke liye 'normal bhejo' bolein"
                  }
                  var shown = name
                  if (number.isEmpty()) {
                      if (name.isEmpty()) return "contact ka naam nahi diya"
                      val all = Device.findContacts(this, name)
                          ?: return "contacts permission nahi hai: MJ app mein '6) Contacts/Call/SMS permission' dabayein"
                      val cands = Device.pickCandidates(all, name)
                      if (cands.isEmpty()) return "contact '$name' not found in phone contacts"
                      val pick = if (cands.size == 1) cands[0] else chooseContact(cands)
                      if (pick == null) return "number nahi chuna gaya, isliye kaam nahi kiya"
                      number = pick.number
                      shown = pick.name
                  }
                  return when (kind) {
                      "call" -> Device.callNumber(this, number) + " [" + shown + "]"
                      "wa" -> {
                          val cc = getSharedPreferences("mj", MODE_PRIVATE).getString("cc", "92") ?: "92"
                          val k = "wa|" + number.filter { it.isDigit() }.takeLast(9) + "|" + text
                          if (text.isNotBlank() && smsSent.contains(k)) {
                              "message already sent once to $shown, not sending it again"
                          } else {
                              val r = Device.whatsappChat(this, number, text, cc)
                              if (text.isBlank() || r.contains("cannot") || r.contains("error")) {
                                  r + " [" + shown + "]"
                              } else {
                                  smsSent.add(k)
                                  r + " [" + shown + "] -> " + pressSendOnce()
                              }
                          }
                      }
                      "share" -> {
                          val video = a.optString("kind").lowercase().contains("video")
                          val k = "share|" + number.filter { it.isDigit() }.takeLast(9) + "|" + video
                          if (smsSent.contains(k)) {
                              "already sent to $shown, not sending again"
                          } else {
                              val uri = Device.latestMedia(this, video)
                              if (uri == null) {
                                  "latest " + (if (video) "video" else "photo") + " nahi mili: gallery permission ke liye MJ app mein '6)' dabayein"
                              } else {
                                  val cc = getSharedPreferences("mj", MODE_PRIVATE).getString("cc", "92") ?: "92"
                                  val r = Device.shareToWhatsApp(this, uri, video, number, cc, text)
                                  if (r.startsWith("cannot")) {
                                      r
                                  } else {
                                      smsSent.add(k)
                                      r + " [" + shown + "] -> " + pressSendOnce()
                                  }
                              }
                          }
                      }
                      else -> {
                          val k = number.filter { it.isDigit() }.takeLast(9) + "|" + text
                          if (!smsSent.add(k)) {
                              "sms already sent once to $shown, not sending it again"
                          } else {
                              Device.sendSms(this, number, text) + " [" + shown + "]"
                          }
                      }
                  }
              }

              private fun findSend(n: AccessibilityNodeInfo?, depth: Int): AccessibilityNodeInfo? {
                  if (n == null || depth > 40) return null
                  val l = (n.contentDescription?.toString() ?: n.text?.toString() ?: "").lowercase().trim()
                  if (l == "send" || l == "भेजें" || l == "بھیجیں") return n
                  for (i in 0 until n.childCount) {
                      val r = findSend(n.getChild(i), depth + 1)
                      if (r != null) return r
                  }
                  return null
              }

              /** Presses WhatsApp's Send button exactly once. */
              private fun pressSendOnce(): String {
                  Thread.sleep(1200)
                  waitStable(3500)
                  for (attempt in 1..3) {
                      val n = findSend(rootInActiveWindow, 0)
                      if (n != null) {
                          var t: AccessibilityNodeInfo? = n
                          while (t != null && !t.isClickable) t = t.parent
                          if (t != null && t.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                              Thread.sleep(500)
                              return "Send pressed once"
                          }
                          val r = Rect()
                          n.getBoundsInScreen(r)
                          if (gestureTap(r.centerX().toFloat(), r.centerY().toFloat())) {
                              Thread.sleep(500)
                              return "Send pressed once"
                          }
                      }
                      Thread.sleep(900)
                  }
                  return "Send button nahi mila, screen dekh kar check karein (dobara send na karein)"
              }

              private fun holdAt(x: Float, y: Float, ms: Long): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, ms.coerceIn(100L, 55000L)))
                      .build()
                  val latch = CountDownLatch(1)
                  var ok = false
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          ok = true
                          latch.countDown()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          latch.countDown()
                      }
                  }, null)
                  latch.await(ms.coerceIn(100L, 55000L) + 3000L, TimeUnit.MILLISECONDS)
                  return ok
              }

              /** Screenshot (Android 11+) answered by the vision model. */
              private fun look(question: String): String {
                  if (Build.VERSION.SDK_INT < 30) return "look not supported on this Android version"
                  val latch = CountDownLatch(1)
                  var bmp: Bitmap? = null
                  try {
                      takeScreenshot(
                          android.view.Display.DEFAULT_DISPLAY,
                          mainExecutor,
                          object : AccessibilityService.TakeScreenshotCallback {
                              override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                                  try {
                                      val hw = Bitmap.wrapHardwareBuffer(result.hardwareBuffer, result.colorSpace)
                                      bmp = hw?.copy(Bitmap.Config.ARGB_8888, false)
                                      hw?.recycle()
                                      result.hardwareBuffer.close()
                                  } catch (e: Exception) {
                                  }
                                  latch.countDown()
                              }

                              override fun onFailure(errorCode: Int) {
                                  latch.countDown()
                              }
                          }
                      )
                  } catch (e: Exception) {
                      return "look failed: ${e.message}"
                  }
                  latch.await(4, TimeUnit.SECONDS)
                  val b = bmp ?: return "look failed: screenshot nahi mila (Accessibility dobara off/on karein)"
                  val w = 720
                  val h = (b.height * (w.toFloat() / b.width)).toInt().coerceAtLeast(1)
                  val small = Bitmap.createScaledBitmap(b, w, h, true)
                  val out = java.io.ByteArrayOutputStream()
                  small.compress(Bitmap.CompressFormat.JPEG, 70, out)
                  val ans = try {
                      Brain.look(aiKey, aiModel, question, out.toByteArray())
                  } catch (e: Exception) {
                      return "look failed: ${e.message}"
                  }
                  return if (ans.isBlank()) "look failed: koi jawab nahi aaya" else "SCREEN ANSWER: $ans"
              }

              private fun longPress(id: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id"
                  var t: AccessibilityNodeInfo? = n
                  while (t != null && !t.isLongClickable) t = t.parent
                  if (t != null && t.performAction(AccessibilityNodeInfo.ACTION_LONG_CLICK)) return "long pressed"
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (holdAt(r.centerX().toFloat(), r.centerY().toFloat(), 800)) "long pressed by gesture" else "long press failed"
              }

              /** Press and hold (for example the WhatsApp microphone while the user records a voice note). */
              private fun holdPress(id: Int, seconds: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id"
                  val secs = seconds.coerceIn(1, 55)
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  tts?.stop()
                  val counter = Thread {
                      try {
                          for (left in secs downTo 1) {
                              setStatus("Ab bolein... $left")
                              Thread.sleep(1000)
                          }
                      } catch (e: InterruptedException) {
                      }
                  }
                  counter.start()
                  val ok = holdAt(r.centerX().toFloat(), r.centerY().toFloat(), secs * 1000L)
                  counter.interrupt()
                  return if (ok) "held for $secs seconds and released (a voice note is sent when released)" else "hold failed"
              }

              /** Waits until the screen stops changing, so the next decision sees the real new screen. */
              private fun settle(action: String) {
                  when (action) {
                      "wait" -> return
                      "open_app", "youtube_search", "web_search", "call", "maps", "open_settings",
                      "call_contact", "whatsapp_chat", "share_latest" -> {
                          Thread.sleep(900)
                          waitStable(4000)
                      }
                      "flashlight", "volume", "brightness", "say", "lock_screen", "screenshot", "send_sms", "alarm", "timer", "look" ->
                          Thread.sleep(150)
                      else -> {
                          Thread.sleep(250)
                          waitStable(2200)
                      }
                  }
              }

              private fun waitStable(maxMs: Long) {
                  val end = System.currentTimeMillis() + maxMs
                  var last = 0
                  var same = 0
                  while (System.currentTimeMillis() < end && !cancelled) {
                      Thread.sleep(250)
                      val h = ScreenReader.read(rootInActiveWindow).hash
                      if (h == last) {
                          same++
                          if (same >= 2) return
                      } else {
                          same = 0
                          last = h
                      }
                  }
              }

              /** Simple torch commands skip the AI completely: instant and cannot go wrong. */
              private fun fastTorch(text: String, checkJoined: Boolean): TaskResult? {
                  val c = normalize(text.lowercase())
                  if (c.split(Regex("\\s+")).size > 9) return null
                  if (checkJoined &&
                      Regex("\\baur\\b|\\band\\b|\\bphir\\b|\\bthen\\b|\\bfir\\b|\\bor\\b|और|اور|फिर|پھر|,").containsMatchIn(c)
                  ) {
                      return null
                  }
                  val torchWords = listOf(
                      "flashlight", "flash light", "torch", "tourch",
                      "ٹارچ", "فلیش", "फ्लैश", "फ़्लैश", "टॉर्च", "टार्च", "टोर्च", "तोर्च"
                  )
                  if (torchWords.none { c.contains(it) }) return null

                  val offRe = Regex("\\boff\\b|band|bujha|بند|آف|بجھا|बंद|बुझा|ऑफ")
                  val onRe = Regex("\\bon\\b|chalu|jalao|jala|kholo|اون|آن|چالو|جلا|चालू|जला|ऑन")
                  val secs = Regex("(\\d+)\\s*(sec|second|سیکنڈ|सेकंड|सेकण्ड)")
                      .find(c)?.groupValues?.get(1)?.toIntOrNull()
                  val wantOn = onRe.containsMatchIn(c)
                  val wantOff = offRe.containsMatchIn(c)

                  val result = when {
                      secs != null && wantOn -> Device.flashlight(this, true, secs)
                      wantOff && !wantOn -> Device.flashlight(this, false)
                      wantOn && !wantOff -> Device.flashlight(this, true)
                      else -> return null
                  }
                  val bad = result.contains("error") || result.contains("not found")
                  val spoken = when {
                      bad -> ""
                      secs != null -> "हो गया।"
                      wantOff -> "टॉर्च बंद हो गई।"
                      else -> "टॉर्च चालू हो गई।"
                  }
                  return TaskResult(!bad, result, spoken)
              }

              private fun normalize(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s) {
                      sb.append(
                          when (ch) {
                              in '٠'..'٩' -> '0' + (ch - '٠')
                              in '۰'..'۹' -> '0' + (ch - '۰')
                              else -> ch
                          }
                      )
                  }
                  return sb.toString()
              }

              // ------------------------------------------------------------------ actions

              private fun execute(action: String, a: JSONObject, snap: ScreenSnapshot, request: String): String {
                  return when (action) {
                      "flashlight" -> Device.flashlight(this, a.optBoolean("on", true), a.optInt("seconds", 0))
                      "open_app" -> Device.openApp(this, a.optString("name"))
                      "youtube_search" -> Device.youtubeSearch(this, a.optString("query"))
                      "web_search" -> Device.webSearch(this, a.optString("query"))
                      "call" -> Device.dial(this, a.optString("number"))
                      "call_contact" -> contactAction(a, "call")
                      "whatsapp_chat" -> contactAction(a, "wa")
                      "send_sms" -> contactAction(a, "sms")
                      "share_latest" -> contactAction(a, "share")
                      "alarm" -> Device.setAlarm(this, a.optInt("hour", -1), a.optInt("minute", 0), a.optString("text"))
                      "timer" -> Device.setTimer(this, a.optInt("seconds", 0), a.optString("text"))
                      "look" -> look(a.optString("text"))
                      "long_press" -> longPress(a.optInt("id", -1), snap)
                      "hold" -> holdPress(a.optInt("id", -1), a.optInt("seconds", 10), snap)
                      "volume" -> Device.volume(this, a.optString("direction"), a.optInt("level", -1))
                      "brightness" -> Device.brightness(this, a.optInt("level", 100))
                      "maps" -> Device.maps(this, a.optString("query"), a.optBoolean("route", true))
                      "open_settings" -> Device.openSettings(this, a.optString("page"))
                      "lock_screen" -> global(GLOBAL_ACTION_LOCK_SCREEN, "screen locked")
                      "screenshot" -> global(GLOBAL_ACTION_TAKE_SCREENSHOT, "screenshot taken")
                      "quick_settings" -> global(GLOBAL_ACTION_QUICK_SETTINGS, "quick settings opened")
                      "tap" -> tap(a.optInt("id", -1), snap, request)
                      "type" -> typeText(a.optInt("id", -1), a.optString("text"), snap)
                      "enter" -> pressEnter(a.optInt("id", -1), snap)
                      "scroll" -> scroll(a.optString("direction", "down"), a.optInt("id", -1), snap)
                      "back" -> global(GLOBAL_ACTION_BACK, "back")
                      "home" -> global(GLOBAL_ACTION_HOME, "home")
                      "recents" -> global(GLOBAL_ACTION_RECENTS, "recents")
                      "notifications" -> global(GLOBAL_ACTION_NOTIFICATIONS, "notifications")
                      "wait" -> {
                          Thread.sleep(a.optLong("ms", 1000).coerceIn(0L, 5000L))
                          "waited"
                      }
                      "say" -> {
                          speak(a.optString("text"), true)
                          "spoken"
                      }
                      else -> "unknown action '$action'"
                  }
              }

              private fun global(code: Int, name: String): String =
                  if (performGlobalAction(code)) name else "$name failed"

              private fun tap(id: Int, snap: ScreenSnapshot, request: String): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id (use a number from the screen list)"
                  val label = (n.text ?: n.contentDescription ?: "").toString().lowercase().trim()
                  val asked = request.lowercase()
                  if (SENSITIVE.any { label.contains(it) && !asked.contains(it) }) {
                      return "BLOCKED: '$label' looks sensitive and the user did not ask for it"
                  }
                  val oneTime = label.isNotEmpty() && TOGGLERS.containsMatchIn(label)
                  if (oneTime && taskTaps.contains(label)) {
                      return "BLOCKED: '$label' was already pressed once in this task; do not press it again, check the screen and call done"
                  }
                  var t: AccessibilityNodeInfo? = n
                  while (t != null && !t.isClickable) t = t.parent
                  val done = if (t != null && t.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                      "tapped"
                  } else {
                      val r = Rect()
                      n.getBoundsInScreen(r)
                      if (gestureTap(r.centerX().toFloat(), r.centerY().toFloat())) "tapped by gesture" else "tap failed"
                  }
                  if (oneTime && !done.contains("failed")) {
                      taskTaps.add(label)
                      return "$done ('$label' is a one-time button: do not press it again)"
                  }
                  return done
              }

              private fun gestureTap(x: Float, y: Float): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 60))
                      .build()
                  val latch = CountDownLatch(1)
                  var ok = false
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          ok = true
                          latch.countDown()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          latch.countDown()
                      }
                  }, null)
                  latch.await(2, TimeUnit.SECONDS)
                  return ok
              }

              /** A real touch on the middle of the element, used when a normal click did nothing. */
              private fun tapGesture(id: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id"
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (gestureTap(r.centerX().toFloat(), r.centerY().toFloat())) "touched" else "touch failed"
              }

              private fun typeText(id: Int, text: String, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id (use a number from the screen list)"
                  n.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  if (!n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)) return "type failed"
                  n.refresh()
                  return "typed; the field now shows: '" + (n.text?.toString()?.take(60) ?: "") + "'"
              }

              private fun pressEnter(id: Int, snap: ScreenSnapshot): String {
                  if (Build.VERSION.SDK_INT < 30) {
                      return "enter not supported on this Android version, tap the search button instead"
                  }
                  val n = snap.nodes.getOrNull(id) ?: findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      ?: return "no input field to press enter in"
                  return if (n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) {
                      "enter pressed"
                  } else {
                      "enter failed"
                  }
              }

              private fun scroll(direction: String, id: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: snap.nodes.firstOrNull { it.isScrollable }
                      ?: return "nothing scrollable on screen"
                  val act = if (direction == "up") {
                      AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  } else {
                      AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  }
                  return if (n.performAction(act)) "scrolled $direction" else "scroll failed (end of list?)"
              }

              // ------------------------------------------------------------------ feedback

              /** msg goes on screen; spoken (if not empty and voice reply is on) goes to the Hindi voice. */
              private fun finish(msg: String, spoken: String = "") {
                  emit("MJ: $msg")
                  setStatus(msg)
                  if (spoken.isNotBlank() && voiceOn()) speak(spoken, true) else Thread.sleep(1000)
              }

              private fun emit(s: String) {
                  synchronized(logs) {
                      logs.add(s)
                      if (logs.size > 200) logs.removeAt(0)
                  }
                  sink?.invoke(s)
              }

              private fun voiceOn(): Boolean = getSharedPreferences("mj", MODE_PRIVATE).getBoolean("voice", true)

              private fun speak(t: String, wait: Boolean) {
                  if (t.isBlank() || !voiceOn() || quietNow) return
                  val engine = tts ?: return
                  val latch = CountDownLatch(1)
                  speakCounter++
                  val id = "mj$speakCounter"
                  speakId = id
                  speakLatch = latch
                  if (engine.speak(t, TextToSpeech.QUEUE_FLUSH, null, id) != TextToSpeech.SUCCESS) return
                  if (wait) {
                      try {
                          latch.await(25, TimeUnit.SECONDS)
                      } catch (e: InterruptedException) {
                      }
                      Thread.sleep(300)
                  }
              }

              private fun setStatus(t: String) {
                  ui.post { statusView?.text = t }
              }

              private fun setBubble(mode: Mode) {
                  val color = when (mode) {
                      Mode.IDLE -> 0xFF1E88E5.toInt()
                      Mode.LISTEN -> 0xFFE53935.toInt()
                      Mode.WORK -> 0xFFFB8C00.toInt()
                  }
                  ui.post { bubbleBg?.setColor(color) }
              }

              private fun showBubble() {
                  ui.post {
                      if (bubble != null) return@post
                      val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val dm = resources.displayMetrics
                      val size = (56 * dm.density).toInt()

                      val bg = GradientDrawable()
                      bg.shape = GradientDrawable.OVAL
                      bg.setColor(0xFF1E88E5.toInt())

                      val v = TextView(this)
                      v.text = "🎤"
                      v.textSize = 22f
                      v.gravity = Gravity.CENTER
                      v.background = bg

                      val lp = WindowManager.LayoutParams(
                          size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.TOP or Gravity.START
                      lp.x = max(0, dm.widthPixels - size - (14 * dm.density).toInt())
                      lp.y = dm.heightPixels / 2

                      var sx = 0f
                      var sy = 0f
                      var ox = 0
                      var oy = 0
                      var moved = false
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = e.rawX
                                  sy = e.rawY
                                  ox = lp.x
                                  oy = lp.y
                                  moved = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (e.rawX - sx).toInt()
                                  val dy = (e.rawY - sy).toInt()
                                  if (abs(dx) > 10 || abs(dy) > 10) moved = true
                                  if (moved) {
                                      lp.x = (ox + dx).coerceIn(0, max(0, dm.widthPixels - size))
                                      lp.y = (oy + dy).coerceIn(0, max(0, dm.heightPixels - size))
                                      try {
                                          wm.updateViewLayout(v, lp)
                                      } catch (ex: Exception) {
                                      }
                                  }
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) startConversation()
                                  true
                              }
                              else -> false
                          }
                      }

                      try {
                          wm.addView(v, lp)
                          bubble = v
                          bubbleBg = bg
                      } catch (e: Exception) {
                          emit("bubble error: ${e.message}")
                      }
                  }
              }

              private fun hideBubble() {
                  ui.post {
                      val b = bubble
                      if (b != null) {
                          try {
                              (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(b)
                          } catch (e: Exception) {
                          }
                      }
                      bubble = null
                      bubbleBg = null
                  }
              }

              private fun showOverlay() {
                  ui.post {
                      if (overlay != null) return@post
                      val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setBackgroundColor(0xE6101820.toInt())
                      row.setPadding(24, 16, 24, 16)

                      val tv = TextView(this)
