              // ------------------------------------------------------------------ one turn

              /** Returns true if the conversation should go on listening. */
              private fun turn(wav: ByteArray?, text: String?, convo: Boolean, fromMic: Boolean): Boolean {
                  showOverlay()
                  val prefs = getSharedPreferences("mj", MODE_PRIVATE)
                  val key = prefs.getString("key", "") ?: ""
                  val model = (prefs.getString("model", "") ?: "").ifEmpty { Brain.DEFAULT_MODEL }
                  val name = (prefs.getString("name", "") ?: "").ifBlank { "Waqas" }
                  val agentModel = (prefs.getString("model2", "") ?: "").ifBlank { model }
                  if (key.isBlank()) {
                      finish("Pehle app mein Gemini API key save karein", "पहले ऐप में जेमिनी की सेट कीजिए।")
                      return false
                  }

                  if (text != null) {
                      setStatus("MJ: $text")
                      emit("Command: $text")
                      if (!fromMic) {
                          val quick = fastTorch(text, true)
                          if (quick != null) {
                              finish(quick.msg, quick.speak)
                              return false
                          }
                      }
                  } else {
                      setStatus("Samajh rahi hoon...")
                  }

                  val history = synchronized(chat) { ArrayList(chat) }
                  val u = try {
                      Brain.understand(key, model, name, wav, text, fromMic, history)
                  } catch (e: Exception) {
                      finish("AI error: ${e.message}")
                      return false
                  }

                  val heard = u.optString("heard").ifBlank { text ?: "" }
                  val mode = u.optString("mode")
                  val reply = u.optString("reply").ifBlank { "Ji" }
                  val spoken = u.optString("speak").ifBlank { reply }
                  if (wav != null || fromMic) emit("Suna: $heard")
                  if (heard.isNotBlank()) addChat("$name: $heard")

                  if (mode == "none") {
                      finish("Samajh nahi aaya, dobara boliye", "माफ़ कीजिए, समझ नहीं आया। फिर से बोलिए।")
                      return true
                  }
                  if (mode == "stop") {
                      addChat("MJ: $reply")
                      finish(reply, spoken)
                      return false
                  }

                  val tasks = ArrayList<String>()
                  val arr = u.optJSONArray("tasks")
                  if (mode == "tasks" && arr != null) {
                      for (i in 0 until minOf(arr.length(), 6)) {
                          val t = arr.optString(i).trim()
                          if (t.isNotEmpty()) tasks.add(t)
                      }
                  }
                  if (tasks.isEmpty()) {
                      addChat("MJ: $reply")
                      finish(reply, spoken)
                      return true
                  }

                  if (tasks.any { RISKY.containsMatchIn(it.lowercase()) }) {
                      if (!convo) {
                          finish(
                              "Yeh kaam wapas nahi ho sakta, is liye sirf mic se bolkar karein",
                              "यह काम वापस नहीं हो सकता, इसलिए माइक से बोलकर कीजिए।"
                          )
                          return false
                      }
                      if (!confirmRisky(key, model)) {
                          finish("Theek hai, maine woh kaam nahi kiya", "ठीक है, मैंने वह काम नहीं किया।")
                          return true
                      }
                  }

                  emit("MJ: $reply")
                  setStatus(reply)
                  speak(spoken, false)

                  val results = ArrayList<TaskResult>()
                  for ((i, t) in tasks.withIndex()) {
                      if (cancelled) break
                      emit("Kaam ${i + 1}/${tasks.size}: $t")
                      setStatus("Kaam ${i + 1}/${tasks.size}: $t")
                      val before = results.mapIndexed { j, r -> tasks[j] + " -> " + r.msg }
                      val after = tasks.drop(i + 1)
                      results.add(runTask(t, heard, key, agentModel, before, after))
                  }
                  if (cancelled) {
                      finish("Roka gaya (stopped)")
                      return false
                  }

                  val msg = results.joinToString("  |  ") { it.msg }
                  val say = results.joinToString("। ") { it.speak }.trim()
                  addChat("MJ: $msg")
                  val tail = if (convo) " और कोई काम?" else ""
                  finish(msg, if (say.isBlank()) "" else say + tail)
                  return true
              }

              private fun addChat(line: String) {
                  synchronized(chat) {
                      chat.add(line)
                      while (chat.size > 12) chat.removeAt(0)
                  }
              }

              // ------------------------------------------------------------------ one task

              private fun runTask(
                  task: String,
                  request: String,
                  key: String,
                  model: String,
                  before: List<String>,
                  after: List<String>
              ): TaskResult {
                  val quick = fastTorch(task, false)
                  if (quick != null) return quick

                  val history = ArrayList<String>()
                  val recent = ArrayList<String>()
                  var lastSig = ""
                  var lastResult = ""
                  var prevHash = 0
                  var prevUi = false
                  var forced = false
                  val stuckMsg = "Atak gayi: '$task' mein wahi action baar baar aa raha tha, ruk gayi"
                  val stuckSpeak = "मैं इस काम में अटक गई, इसलिए रुक गई।"

                  for (step in 1..15) {
                      if (cancelled) return TaskResult(false, "Roka gaya (stopped)", "")
                      var root = rootInActiveWindow
                      if (root == null) {
                          Thread.sleep(500)
                          root = rootInActiveWindow
                      }
                      val snap = ScreenReader.read(root)

                      if (prevUi && history.isNotEmpty() && snap.hash == prevHash) {
                          history[history.size - 1] = history.last() + " (screen did not change)"
                      }

                      val reply = try {
                          Brain.decide(key, model, task, before, after, history, snap)
                      } catch (e: Exception) {
                          return TaskResult(false, "AI error: ${e.message}", "")
                      }
                      val action = reply.optString("action")
                      val args = Brain.args(reply)

                      if (action == "done") {
                          val m = args.optString("message", "").ifBlank { args.optString("text", "") }.ifBlank { "Ho gaya" }
                          val s = args.optString("speak", "").ifBlank { m }
                          return TaskResult(args.optBoolean("ok", true), m, s)
                      }

                      // the same action again and again, whatever the screen looks like
                      val same = action + args.toString()
                      val limit = if (action == "scroll" || action == "wait") 4 else 2
                      if (recent.takeLast(10).count { it == same } >= limit) {
                          return TaskResult(false, stuckMsg, stuckSpeak)
                      }
                      recent.add(same)

                      // the same action on a screen that did not change
                      val sig = same + snap.hash
                      if (sig == lastSig) {
                          if (action in DIRECT && !failed(lastResult)) {
                              return TaskResult(true, "Ho gaya ($lastResult)", "हो गया।")
                          }
                          if (action == "tap" && !forced) {
                              forced = true
                              val r = tapGesture(args.optInt("id", -1), snap)
                              history.add("$action $args -> first click did nothing, used a real touch: $r")
                              emit("Step $step: real touch tap $args")
                              prevUi = true
                              prevHash = snap.hash
                              settle("tap")
                              continue
                          }
                          return TaskResult(false, stuckMsg, stuckSpeak)
                      }
                      forced = false
                      lastSig = sig

                      emit("Step $step: $action $args")
                      setStatus("$task (step $step)")

                      val result = execute(action, args, snap, request)
                      lastResult = result
                      history.add("$action $args -> $result")
                      prevUi = action == "tap" || action == "type" || action == "scroll" || action == "enter"
                      prevHash = snap.hash
                      settle(action)
                  }
                  return TaskResult(false, "'$task' poora nahi ho saka (15 step ho gaye)", "यह काम पूरा नहीं हो पाया।")
              }

              private fun failed(r: String): Boolean {
                  val s = r.lowercase()
                  return s.contains("not found") || s.contains("error") || s.contains("failed") ||
                      s.contains("nahi") || s.contains("blocked") || s.contains("cannot") || s.startsWith("bad ")
              }

              /** Asks (by voice) before irreversible work. Only a clear yes continues. */
              private fun confirmRisky(key: String, model: String): Boolean {
                  setBubble(Mode.LISTEN)
                  finish(
                      "Yeh kaam wapas nahi ho sakta. Pakka? 'Haan' boliye",
                      "यह काम वापस नहीं हो सकता। क्या आप पक्का चाहते हैं? हाँ बोलिए।"
                  )
                  if (cancelled) return false
                  setStatus("Haan ya na boliye...")
                  val rec = Recorder.record(8000L) { cancelled }
                  var answer = false
                  val w = rec.wav
                  if (w != null) {
                      answer = try {
                          Brain.confirm(key, model, w, null)
                      } catch (e: Exception) {
                          false
                      }
                  } else if (rec.blocked) {
                      val t = listenGoogle()
                      if (!t.isNullOrBlank()) {
                          answer = try {
                              Brain.confirm(key, model, null, t)
                          } catch (e: Exception) {
                              false
                          }
                      }
                  }
                  setBubble(Mode.WORK)
                  return answer
              }

              /** Waits until the screen stops changing, so the next decision sees the real new screen. */
              private fun settle(action: String) {
                  when (action) {
                      "wait" -> return
                      "open_app", "youtube_search", "web_search", "call" -> {
                          Thread.sleep(1200)
                          waitStable(4500)
                      }
                      "flashlight", "volume", "brightness", "say" -> Thread.sleep(200)
                      else -> {
                          Thread.sleep(500)
                          waitStable(2500)
                      }
                  }
              }

              private fun waitStable(maxMs: Long) {
                  val end = System.currentTimeMillis() + maxMs
                  var last = 0
                  var same = 0
                  while (System.currentTimeMillis() < end && !cancelled) {
                      Thread.sleep(350)
                      val h = ScreenReader.read(rootInActiveWindow).hash
                      if (h == last) {
                          same++
                          if (same >= 2) return
                      } else {
                          same = 0
                          last = h
                      }
                  }
              }

              /** Simple torch commands skip the AI completely: instant and cannot go wrong. */
              private fun fastTorch(text: String, checkJoined: Boolean): TaskResult? {
                  val c = normalize(text.lowercase())
                  if (c.split(Regex("\\s+")).size > 9) return null
                  if (checkJoined &&
                      Regex("\\baur\\b|\\band\\b|\\bphir\\b|\\bthen\\b|\\bfir\\b|\\bor\\b|और|اور|फिर|پھر|,").containsMatchIn(c)
                  ) {
                      return null
                  }
                  val torchWords = listOf(
                      "flashlight", "flash light", "torch", "tourch",
                      "ٹارچ", "فلیش", "फ्लैश", "फ़्लैश", "टॉर्च", "टार्च"
                  )
                  if (torchWords.none { c.contains(it) }) return null

                  val offRe = Regex("\\boff\\b|band|bujha|بند|آف|بجھا|बंद|बुझा|ऑफ")
                  val onRe = Regex("\\bon\\b|chalu|jalao|jala|kholo|اون|آن|چالو|جلا|चालू|जला|ऑन")
                  val secs = Regex("(\\d+)\\s*(sec|second|سیکنڈ|सेकंड|सेकण्ड)")
                      .find(c)?.groupValues?.get(1)?.toIntOrNull()
                  val wantOn = onRe.containsMatchIn(c)
                  val wantOff = offRe.containsMatchIn(c)

                  val result = when {
                      secs != null && wantOn -> Device.flashlight(this, true, secs)
                      wantOff && !wantOn -> Device.flashlight(this, false)
                      wantOn && !wantOff -> Device.flashlight(this, true)
                      else -> return null
                  }
                  val bad = result.contains("error") || result.contains("not found")
                  val spoken = when {
                      bad -> ""
                      secs != null -> "हो गया।"
                      wantOff -> "टॉर्च बंद हो गई।"
                      else -> "टॉर्च चालू हो गई।"
                  }
                  return TaskResult(!bad, result, spoken)
              }

              private fun normalize(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s) {
                      sb.append(
                          when (ch) {
                              in '٠'..'٩' -> '0' + (ch - '٠')
                              in '۰'..'۹' -> '0' + (ch - '۰')
                              else -> ch
                          }
                      )
                  }
                  return sb.toString()
              }

              // ------------------------------------------------------------------ actions

              private fun execute(action: String, a: JSONObject, snap: ScreenSnapshot, request: String): String {
                  return when (action) {
                      "flashlight" -> Device.flashlight(this, a.optBoolean("on", true), a.optInt("seconds", 0))
                      "open_app" -> Device.openApp(this, a.optString("name"))
                      "youtube_search" -> Device.youtubeSearch(this, a.optString("query"))
                      "web_search" -> Device.webSearch(this, a.optString("query"))
                      "call" -> Device.dial(this, a.optString("number"))
                      "volume" -> Device.volume(this, a.optString("direction"), a.optInt("level", -1))
                      "brightness" -> Device.brightness(this, a.optInt("level", 100))
                      "maps" -> Device.maps(this, a.optString("query"), a.optBoolean("route", true))
                      "open_settings" -> Device.openSettings(this, a.optString("page"))
                      "lock_screen" -> global(GLOBAL_ACTION_LOCK_SCREEN, "screen locked")
                      "screenshot" -> global(GLOBAL_ACTION_TAKE_SCREENSHOT, "screenshot taken")
                      "quick_settings" -> global(GLOBAL_ACTION_QUICK_SETTINGS, "quick settings opened")
                      "tap" -> tap(a.optInt("id", -1), snap, request)
                      "type" -> typeText(a.optInt("id", -1), a.optString("text"), snap)
                      "enter" -> pressEnter(a.optInt("id", -1), snap)
                      "scroll" -> scroll(a.optString("direction", "down"), a.optInt("id", -1), snap)
                      "back" -> global(GLOBAL_ACTION_BACK, "back")
                      "home" -> global(GLOBAL_ACTION_HOME, "home")
                      "recents" -> global(GLOBAL_ACTION_RECENTS, "recents")
                      "notifications" -> global(GLOBAL_ACTION_NOTIFICATIONS, "notifications")
                      "wait" -> {
                          Thread.sleep(a.optLong("ms", 1000).coerceIn(0L, 5000L))
                          "waited"
                      }
                      "say" -> {
                          speak(a.optString("text"), true)
                          "spoken"
                      }
                      else -> "unknown action '$action'"
                  }
              }

              private fun global(code: Int, name: String): String =
                  if (performGlobalAction(code)) name else "$name failed"

              private fun tap(id: Int, snap: ScreenSnapshot, request: String): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id (use a number from the screen list)"
                  val label = (n.text ?: n.contentDescription ?: "").toString().lowercase()
                  val asked = request.lowercase()
                  if (SENSITIVE.any { label.contains(it) && !asked.contains(it) }) {
                      return "BLOCKED: '$label' looks sensitive and the user did not ask for it"
                  }
                  var t: AccessibilityNodeInfo? = n
                  while (t != null && !t.isClickable) t = t.parent
                  if (t != null && t.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return "tapped"
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (gestureTap(r.centerX().toFloat(), r.centerY().toFloat())) "tapped by gesture" else "tap failed"
              }

              private fun gestureTap(x: Float, y: Float): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 60))
                      .build()
                  val latch = CountDownLatch(1)
                  var ok = false
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          ok = true
                          latch.countDown()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          latch.countDown()
                      }
                  }, null)
                  latch.await(2, TimeUnit.SECONDS)
                  return ok
              }

              private fun typeText(id: Int, text: String, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id (use a number from the screen list)"
                  n.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  if (!n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)) return "type failed"
                  n.refresh()
                  return "typed; the field now shows: '" + (n.text?.toString()?.take(60) ?: "") + "'"
              }

              /** A real touch on the middle of the element, used when a normal click did nothing. */
              private fun tapGesture(id: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id"
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (gestureTap(r.centerX().toFloat(), r.centerY().toFloat())) "touched" else "touch failed"
              }

              private fun pressEnter(id: Int, snap: ScreenSnapshot): String {
                  if (Build.VERSION.SDK_INT < 30) {
                      return "enter not supported on this Android version, tap the search button instead"
                  }
                  val n = snap.nodes.getOrNull(id) ?: findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      ?: return "no input field to press enter in"
                  return if (n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) {
                      "enter pressed"
                  } else {
                      "enter failed"
                  }
              }

              private fun scroll(direction: String, id: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: snap.nodes.firstOrNull { it.isScrollable }
                      ?: return "nothing scrollable on screen"
                  val act = if (direction == "up") {
                      AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  } else {
                      AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  }
                  return if (n.performAction(act)) "scrolled $direction" else "scroll failed (end of list?)"
              }

              // ------------------------------------------------------------------ feedback

              /** msg goes on screen; spoken (if not empty and voice reply is on) goes to the Hindi voice. */
              private fun finish(msg: String, spoken: String = "") {
                  emit("MJ: $msg")
                  setStatus(msg)
                  if (spoken.isNotBlank() && voiceOn()) speak(spoken, true) else Thread.sleep(1200)
              }

              private fun emit(s: String) {
                  synchronized(logs) {
                      logs.add(s)
                      if (logs.size > 200) logs.removeAt(0)
                  }
                  sink?.invoke(s)
              }

              private fun voiceOn(): Boolean = getSharedPreferences("mj", MODE_PRIVATE).getBoolean("voice", true)

              private fun speak(t: String, wait: Boolean) {
                  if (t.isBlank() || !voiceOn()) return
                  val engine = tts ?: return
                  val latch = CountDownLatch(1)
                  speakCounter++
                  val id = "mj$speakCounter"
                  speakId = id
                  speakLatch = latch
                  if (engine.speak(t, TextToSpeech.QUEUE_FLUSH, null, id) != TextToSpeech.SUCCESS) return
                  if (wait) {
                      try {
                          latch.await(25, TimeUnit.SECONDS)
                      } catch (e: InterruptedException) {
                      }
                      Thread.sleep(350)
                  }
              }

              private fun setStatus(t: String) {
                  ui.post { statusView?.text = t }
              }

              private fun setBubble(mode: Mode) {
                  val color = when (mode) {
                      Mode.IDLE -> 0xFF1E88E5.toInt()
                      Mode.LISTEN -> 0xFFE53935.toInt()
                      Mode.WORK -> 0xFFFB8C00.toInt()
                  }
                  ui.post { bubbleBg?.setColor(color) }
              }

              private fun showBubble() {
                  ui.post {
                      if (bubble != null) return@post
                      val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val dm = resources.displayMetrics
                      val size = (56 * dm.density).toInt()

                      val bg = GradientDrawable()
                      bg.shape = GradientDrawable.OVAL
                      bg.setColor(0xFF1E88E5.toInt())

                      val v = TextView(this)
                      v.text = "🎤"
                      v.textSize = 22f
                      v.gravity = Gravity.CENTER
                      v.background = bg

                      val lp = WindowManager.LayoutParams(
                          size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.TOP or Gravity.START
                      lp.x = max(0, dm.widthPixels - size - (14 * dm.density).toInt())
                      lp.y = dm.heightPixels / 2

                      var sx = 0f
                      var sy = 0f
                      var ox = 0
                      var oy = 0
                      var moved = false
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = e.rawX
                                  sy = e.rawY
                                  ox = lp.x
                                  oy = lp.y
                                  moved = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (e.rawX - sx).toInt()
                                  val dy = (e.rawY - sy).toInt()
                                  if (abs(dx) > 10 || abs(dy) > 10) moved = true
                                  if (moved) {
                                      lp.x = (ox + dx).coerceIn(0, max(0, dm.widthPixels - size))
                                      lp.y = (oy + dy).coerceIn(0, max(0, dm.heightPixels - size))
                                      try {
                                          wm.updateViewLayout(v, lp)
                                      } catch (ex: Exception) {
                                      }
                                  }
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) startConversation()
                                  true
                              }
                              else -> false
                          }
                      }

                      try {
                          wm.addView(v, lp)
                          bubble = v
                          bubbleBg = bg
                      } catch (e: Exception) {
                          emit("bubble error: ${e.message}")
                      }
                  }
              }

              private fun hideBubble() {
                  ui.post {
                      val b = bubble
                      if (b != null) {
                          try {
                              (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(b)
                          } catch (e: Exception) {
                          }
                      }
                      bubble = null
                      bubbleBg = null
                  }
              }

              private fun showOverlay() {
                  ui.post {
                      if (overlay != null) return@post
                      val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setBackgroundColor(0xE6101820.toInt())
                      row.setPadding(24, 16, 24, 16)

                      val tv = TextView(this)
                      tv.setTextColor(Color.WHITE)
                      tv.textSize = 13f

                      val stop = Button(this)
                      stop.text = "STOP"
                      stop.setOnClickListener { stopAll() }

                      row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(
                          stop,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      )

                      val lp = WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.BOTTOM
                      try {
                          wm.addView(row, lp)
                          overlay = row
                          statusView = tv
                      } catch (e: Exception) {
                          emit("overlay error: ${e.message}")
                      }
                  }
              }

              private fun hideOverlay() {
                  ui.post {
                      val o = overlay
                      if (o != null) {
                          try {
                              (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(o)
                          } catch (e: Exception) {
                          }
                      }
                      overlay = null
                      statusView = null
                  }
              }
          }
