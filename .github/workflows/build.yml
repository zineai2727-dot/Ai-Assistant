                  }
                  if (!VoskHelper.hasModel(this)) {
                      Toast.makeText(this, "Pehle 7) se Vosk model chunein", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (!micGranted()) {
                      askMic()
                      return
                  }
                  if (MJService.instance == null) {
                      Toast.makeText(this, "Pehle Accessibility ON karein", Toast.LENGTH_LONG).show()
                      return
                  }
                  try {
                      startForegroundService(svc)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Wake word shuru nahi hua: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun updateStatus() {
                  val svc = if (MJService.instance != null) "ON" else "OFF"
                  val ovl = if (Settings.canDrawOverlays(this)) "OK" else "NAHI"
                  val mic = if (micGranted()) "OK" else "NAHI"
                  val bri = if (Settings.System.canWrite(this)) "OK" else "NAHI"
                  val con = if (checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) "OK" else "NAHI"
                  val vosk = if (VoskHelper.hasModel(this)) "OK" else "NAHI"
                  status.text = "Accessibility: $svc | Display over apps: $ovl | Mic: $mic | Brightness: $bri | Contacts: $con | Vosk: $vosk"
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  updateStatus()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 7 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      logView.append("Vosk model copy shuru, thora intezaar karein...\n")
                      Thread {
                          val msg = VoskHelper.install(this, uri) { p -> runOnUiThread { status.text = p } }
                          runOnUiThread {
                              logView.append(msg + "\n")
                              updateStatus()
                          }
                      }.start()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
                  showLogs()
                  MJService.sink = { line -> runOnUiThread { logView.append(line + "\n") } }
              }

              override fun onPause() {
                  super.onPause()
                  MJService.sink = null
              }

              private fun showLogs() {
                  val copy = synchronized(MJService.logs) { ArrayList(MJService.logs) }
                  logView.text = copy.joinToString("\n")
              }

              private fun send() {
                  val t = cmdBox.text.toString().trim()
                  if (t.isEmpty()) return
                  val s = MJService.instance
                  if (s == null) {
                      Toast.makeText(this, "Pehle Accessibility ON karein", Toast.LENGTH_LONG).show()
                      return
                  }
                  cmdBox.setText("")
                  s.runCommand(t)
                  moveTaskToBack(true)
              }
          }
