name: Build MJ APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write MJ project files
        run: |
          set -e
          cat > README.md <<'MJEOF'
          # MJ - personal phone assistant (Android)

          Accessibility Service + Gemini. Quick commands (flashlight) run locally with no AI; everything else is planned one step at a time by Gemini, with loop guards, a STOP button and a 20-step limit.

          Build: push this project to GitHub; the workflow in `.github/workflows/build.yml` builds `app-debug.apk` and publishes it under Releases.

          First run on the phone:
          1. Open MJ -> "Accessibility ON karein" -> MJ -> turn on.
          2. "Display over other apps" -> allow MJ.
          3. Paste a Gemini API key (https://aistudio.google.com/apikey), tap Save.
          4. Type or speak a command, tap Send.
          MJEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'MJEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.waqas.mj"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.waqas.mj"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          MJEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'MJEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MJService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          MJEOF
          mkdir -p app/src/main/java/com/waqas/mj
          cat > app/src/main/java/com/waqas/mj/Brain.kt <<'MJEOF'
          package com.waqas.mj

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /** Asks Gemini for the single next action. Stateless: every call carries the full context. */
          object Brain {

              private const val SYSTEM = """
          You are MJ, a fast and reliable assistant that controls an Android phone through an accessibility service.
          The user may speak English, Urdu, Roman Urdu or Hindi.

          Each turn you get the user's command, the current app, a numbered list of what is on screen, and the actions already taken.
          Reply with exactly ONE next action as JSON: {"action":"<name>","args":{...}}

          Actions:
          - flashlight {"on":true|false,"seconds":optional number}  (turns on, waits, turns off if seconds is given)
          - open_app {"name":"app name"}
          - youtube_search {"query":"..."}
          - web_search {"query":"..."}
          - call {"number":"..."}  (opens the dialer with the number)
          - volume {"direction":"up|down|mute|unmute"}
          - tap {"id":N}
          - type {"id":N,"text":"..."}
          - enter {"id":optional N}  (presses the keyboard Enter/Search key)
          - scroll {"direction":"up|down","id":optional N}
          - back {}   home {}   recents {}   notifications {}
          - wait {"ms":number up to 5000}
          - say {"text":"..."}  (speaks aloud)
          - done {"message":"..."}  (task finished or impossible)

          Rules:
          1. Prefer direct actions (flashlight, open_app, youtube_search, web_search, call, volume, back, home) over tapping the screen. They are faster and cannot loop.
          2. Use element numbers from the current screen list only. Numbers change every turn.
          3. If the last action says "screen did not change", do NOT repeat it. Try another element, scroll, or a different approach.
          4. Never repeat the same action more than twice. If you cannot finish, call done and explain why.
          5. After youtube_search or web_search the results page is already open. If the user wants a specific video or result, tap the matching element, then call done.
          6. Never pay, transfer money, delete data, uninstall or buy anything unless the user explicitly asked for exactly that.
          7. Call done as soon as the task is complete. Write done.message as one short sentence in the user's language (Roman Urdu if they wrote Roman Urdu).
          8. Output only the JSON object and nothing else.
          """

              fun decide(
                  key: String,
                  model: String,
                  command: String,
                  history: List<String>,
                  snap: ScreenSnapshot
              ): JSONObject {
                  val prompt = buildString {
                      append("USER COMMAND: ").append(command).append("\n\n")
                      append("CURRENT APP: ").append(snap.pkg).append("\n")
                      append("SCREEN ELEMENTS:\n").append(snap.text).append("\n")
                      append("ACTIONS SO FAR:\n")
                      if (history.isEmpty()) {
                          append("(none)\n")
                      } else {
                          for (h in history.takeLast(8)) append("- ").append(h).append("\n")
                      }
                      append("\nReply with the single next action as JSON.")
                  }

                  val body = JSONObject()
                      .put(
                          "systemInstruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", SYSTEM)))
                      )
                      .put(
                          "contents",
                          JSONArray().put(
                              JSONObject().put("role", "user")
                                  .put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                          )
                      )
                      .put(
                          "generationConfig",
                          JSONObject().put("temperature", 0).put("responseMimeType", "application/json")
                      )

                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
                  val c = url.openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = 15000
                      c.readTimeout = 40000
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("x-goog-api-key", key)
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream.bufferedReader().use { it.readText() }
                      if (code !in 200..299) {
                          val hint = when (code) {
                              400 -> "API key ya model ka naam galat ho sakta hai"
                              429 -> "free limit poori, thori der baad try karein"
                              else -> ""
                          }
                          throw RuntimeException("HTTP $code $hint ${text.take(150)}")
                      }
                      val out = JSONObject(text)
                          .getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                          .getString("text")
                      val cleaned = out.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                      return JSONObject(cleaned)
                  } finally {
                      c.disconnect()
                  }
              }
          }
          MJEOF
          mkdir -p app/src/main/java/com/waqas/mj
          cat > app/src/main/java/com/waqas/mj/Device.kt <<'MJEOF'
          package com.waqas.mj

          import android.content.ActivityNotFoundException
          import android.content.Context
          import android.content.Intent
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import java.net.URLEncoder

          /** Direct phone commands. These never touch the screen, so they are fast and cannot loop. */
          object Device {

              fun flashlight(ctx: Context, on: Boolean, seconds: Int = 0): String {
                  return try {
                      val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var id: String? = null
                      for (cid in cm.cameraIdList) {
                          val c = cm.getCameraCharacteristics(cid)
                          val hasFlash = c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          val back = c.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                          if (hasFlash && back) {
                              id = cid
                              break
                          }
                      }
                      if (id == null) {
                          "flashlight not found on this phone"
                      } else if (on && seconds > 0) {
                          cm.setTorchMode(id, true)
                          Thread.sleep(seconds.coerceIn(1, 60) * 1000L)
                          cm.setTorchMode(id, false)
                          "flashlight was on for $seconds seconds, now off"
                      } else {
                          cm.setTorchMode(id, on)
                          if (on) "flashlight on" else "flashlight off"
                      }
                  } catch (e: Exception) {
                      "flashlight error: ${e.message}"
                  }
              }

              fun openApp(ctx: Context, name: String): String {
                  val pm = ctx.packageManager
                  val probe = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(probe, 0)
                  val q = name.lowercase().trim()
                  if (q.isEmpty()) return "no app name given"
                  val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "app '$name' not found"
                  val launch = pm.getLaunchIntentForPackage(hit.activityInfo.packageName)
                      ?: return "cannot launch ${hit.loadLabel(pm)}"
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(launch)
                      "opened ${hit.loadLabel(pm)}"
                  } catch (e: Exception) {
                      "cannot open: ${e.message}"
                  }
              }

              fun openUrl(ctx: Context, url: String, pkg: String? = null): String {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  if (pkg != null) i.setPackage(pkg)
                  return try {
                      ctx.startActivity(i)
                      "opened"
                  } catch (e: ActivityNotFoundException) {
                      try {
                          i.setPackage(null)
                          ctx.startActivity(i)
                          "opened in browser"
                      } catch (e2: Exception) {
                          "cannot open: ${e2.message}"
                      }
                  } catch (e: Exception) {
                      "cannot open: ${e.message}"
                  }
              }

              fun youtubeSearch(ctx: Context, query: String): String {
                  val url = "https://www.youtube.com/results?search_query=" + URLEncoder.encode(query, "UTF-8")
                  return openUrl(ctx, url, "com.google.android.youtube") + " (youtube search: $query)"
              }

              fun webSearch(ctx: Context, query: String): String {
                  val url = "https://www.google.com/search?q=" + URLEncoder.encode(query, "UTF-8")
                  return openUrl(ctx, url) + " (web search: $query)"
              }

              /** Opens the dialer with the number filled in. The user (or a later step) presses call. */
              fun dial(ctx: Context, number: String): String {
                  val i = Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(number)))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      "dialer opened with $number"
                  } catch (e: Exception) {
                      "cannot open dialer: ${e.message}"
                  }
              }

              fun volume(ctx: Context, direction: String): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val d = when (direction) {
                      "up" -> AudioManager.ADJUST_RAISE
                      "down" -> AudioManager.ADJUST_LOWER
                      "mute" -> AudioManager.ADJUST_MUTE
                      "unmute" -> AudioManager.ADJUST_UNMUTE
                      else -> return "bad volume direction '$direction'"
                  }
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, AudioManager.FLAG_SHOW_UI)
                  return "volume $direction"
              }
          }
          MJEOF
          mkdir -p app/src/main/java/com/waqas/mj
          cat > app/src/main/java/com/waqas/mj/MJService.kt <<'MJEOF'
          package com.waqas.mj

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONObject
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * MJ's body: an accessibility service that can read the screen and act on it.
           *
           * Reliability rules built in:
           *  - quick commands (flashlight on/off/for N seconds) run locally, no AI, no screen touching
           *  - the AI prefers direct phone actions over tapping
           *  - every screen action is verified: if the screen did not change the AI is told
           *  - the same action on the same screen twice in a row stops the run (no endless tapping)
           *  - hard limit of 20 steps, and a STOP button is always on screen while MJ works
           *  - payment / delete style buttons are blocked unless the user asked for them
           */
          class MJService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: MJService? = null
                  val logs = ArrayList<String>()

                  @Volatile
                  var sink: ((String) -> Unit)? = null

                  private val SENSITIVE = listOf(
                      "pay", "send money", "transfer", "delete", "uninstall",
                      "purchase", "buy", "erase", "factory reset", "remove account"
                  )
              }

              private val ui = Handler(Looper.getMainLooper())

              @Volatile
              private var cancelled = false

              @Volatile
              private var running = false
              private var overlay: LinearLayout? = null
              private var statusView: TextView? = null
              private var tts: TextToSpeech? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          try {
                              tts?.language = Locale.getDefault()
                          } catch (e: Exception) {
                          }
                      }
                  }
                  emit("MJ service ON")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  cancelled = true
                  tts?.shutdown()
                  return super.onUnbind(intent)
              }

              // ------------------------------------------------------------------ public

              fun runCommand(cmd: String) {
                  if (running) {
                      emit("MJ pehle se kaam kar rahi hai")
                      return
                  }
                  running = true
                  cancelled = false
                  Thread {
                      try {
                          agent(cmd)
                      } catch (e: Exception) {
                          finish("Error: ${e.message}")
                      } finally {
                          running = false
                          hideOverlay()
                      }
                  }.start()
              }

              // ------------------------------------------------------------------ the loop

              private fun agent(cmd: String) {
                  showOverlay()
                  setStatus("MJ: $cmd")
                  emit("Command: $cmd")

                  if (fastPath(cmd)) return

                  val prefs = getSharedPreferences("mj", MODE_PRIVATE)
                  val key = prefs.getString("key", "") ?: ""
                  val model = (prefs.getString("model", "") ?: "").ifEmpty { "gemini-2.5-flash" }
                  if (key.isBlank()) {
                      finish("Pehle app mein Gemini API key save karein")
                      return
                  }

                  val history = ArrayList<String>()
                  var lastSig = ""
                  var prevHash = 0
                  var prevUi = false

                  for (step in 1..20) {
                      if (cancelled) {
                          finish("Roka gaya (stopped)")
                          return
                      }
                      var root = rootInActiveWindow
                      if (root == null) {
                          Thread.sleep(500)
                          root = rootInActiveWindow
                      }
                      val snap = ScreenReader.read(root)

                      if (prevUi && history.isNotEmpty() && snap.hash == prevHash) {
                          history[history.size - 1] = history.last() + " (screen did not change)"
                      }

                      val reply = try {
                          Brain.decide(key, model, cmd, history, snap)
                      } catch (e: Exception) {
                          finish("AI error: ${e.message}")
                          return
                      }
                      val action = reply.optString("action")
                      val args = reply.optJSONObject("args") ?: JSONObject()

                      val sig = action + args.toString() + snap.hash
                      if (sig == lastSig) {
                          finish("Atak gayi: wahi action dobara aa raha tha, ruk gayi")
                          return
                      }
                      lastSig = sig

                      emit("Step $step: $action $args")
                      setStatus("Step $step: $action")

                      if (action == "done") {
                          finish(args.optString("message", "Ho gaya"))
                          return
                      }

                      val result = execute(action, args, snap, cmd)
                      history.add("$action $args -> $result")
                      prevUi = action == "tap" || action == "type" || action == "scroll" || action == "enter"
                      prevHash = snap.hash
                      Thread.sleep(if (action == "wait") 0L else 700L)
                  }
                  finish("Step limit (20) poori ho gayi")
              }

              /** Simple torch commands skip the AI completely: instant and cannot go wrong. */
              private fun fastPath(cmd: String): Boolean {
                  val c = normalize(cmd.lowercase())
                  val torchWords = listOf(
                      "flashlight", "flash light", "torch", "tourch",
                      "ٹارچ", "فلیش", "फ्लैश", "फ़्लैश", "टॉर्च", "टार्च"
                  )
                  if (torchWords.none { c.contains(it) }) return false

                  val offRe = Regex("\\boff\\b|band|bujha|بند|آف|بجھا|बंद|बुझा|ऑफ")
                  val onRe = Regex("\\bon\\b|chalu|jalao|jala|kholo|اون|آن|چالو|جلا|चालू|जला|ऑन")
                  val secs = Regex("(\\d+)\\s*(sec|second|سیکنڈ|सेकंड|सेकण्ड)")
                      .find(c)?.groupValues?.get(1)?.toIntOrNull()
                  val wantOn = onRe.containsMatchIn(c)
                  val wantOff = offRe.containsMatchIn(c)

                  val result = when {
                      secs != null && wantOn -> Device.flashlight(this, true, secs)
                      wantOff && !wantOn -> Device.flashlight(this, false)
                      wantOn && !wantOff -> Device.flashlight(this, true)
                      else -> return false
                  }
                  finish(result)
                  return true
              }

              private fun normalize(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s) {
                      sb.append(
                          when (ch) {
                              in '٠'..'٩' -> '0' + (ch - '٠')
                              in '۰'..'۹' -> '0' + (ch - '۰')
                              else -> ch
                          }
                      )
                  }
                  return sb.toString()
              }

              // ------------------------------------------------------------------ actions

              private fun execute(action: String, a: JSONObject, snap: ScreenSnapshot, cmd: String): String {
                  return when (action) {
                      "flashlight" -> Device.flashlight(this, a.optBoolean("on", true), a.optInt("seconds", 0))
                      "open_app" -> Device.openApp(this, a.optString("name"))
                      "youtube_search" -> Device.youtubeSearch(this, a.optString("query"))
                      "web_search" -> Device.webSearch(this, a.optString("query"))
                      "call" -> Device.dial(this, a.optString("number"))
                      "volume" -> Device.volume(this, a.optString("direction"))
                      "tap" -> tap(a.optInt("id", -1), snap, cmd)
                      "type" -> typeText(a.optInt("id", -1), a.optString("text"), snap)
                      "enter" -> pressEnter(a.optInt("id", -1), snap)
                      "scroll" -> scroll(a.optString("direction", "down"), a.optInt("id", -1), snap)
                      "back" -> global(GLOBAL_ACTION_BACK, "back")
                      "home" -> global(GLOBAL_ACTION_HOME, "home")
                      "recents" -> global(GLOBAL_ACTION_RECENTS, "recents")
                      "notifications" -> global(GLOBAL_ACTION_NOTIFICATIONS, "notifications")
                      "wait" -> {
                          Thread.sleep(a.optLong("ms", 1000).coerceIn(0L, 5000L))
                          "waited"
                      }
                      "say" -> {
                          speak(a.optString("text"))
                          "spoken"
                      }
                      else -> "unknown action '$action'"
                  }
              }

              private fun global(code: Int, name: String): String =
                  if (performGlobalAction(code)) name else "$name failed"

              private fun tap(id: Int, snap: ScreenSnapshot, cmd: String): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id"
                  val label = (n.text ?: n.contentDescription ?: "").toString().lowercase()
                  val asked = cmd.lowercase()
                  if (SENSITIVE.any { label.contains(it) && !asked.contains(it) }) {
                      return "BLOCKED: '$label' looks sensitive and the user did not ask for it"
                  }
                  var t: AccessibilityNodeInfo? = n
                  while (t != null && !t.isClickable) t = t.parent
                  if (t != null && t.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return "tapped"
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (gestureTap(r.centerX().toFloat(), r.centerY().toFloat())) "tapped by gesture" else "tap failed"
              }

              private fun gestureTap(x: Float, y: Float): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 60))
                      .build()
                  val latch = CountDownLatch(1)
                  var ok = false
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          ok = true
                          latch.countDown()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          latch.countDown()
                      }
                  }, null)
                  latch.await(2, TimeUnit.SECONDS)
                  return ok
              }

              private fun typeText(id: Int, text: String, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: return "bad element id $id"
                  n.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return if (n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)) "typed" else "type failed"
              }

              private fun pressEnter(id: Int, snap: ScreenSnapshot): String {
                  if (Build.VERSION.SDK_INT < 30) {
                      return "enter not supported on this Android version, tap the search button instead"
                  }
                  val n = snap.nodes.getOrNull(id) ?: findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      ?: return "no input field to press enter in"
                  return if (n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) {
                      "enter pressed"
                  } else {
                      "enter failed"
                  }
              }

              private fun scroll(direction: String, id: Int, snap: ScreenSnapshot): String {
                  val n = snap.nodes.getOrNull(id) ?: snap.nodes.firstOrNull { it.isScrollable }
                      ?: return "nothing scrollable on screen"
                  val act = if (direction == "up") {
                      AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  } else {
                      AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  }
                  return if (n.performAction(act)) "scrolled $direction" else "scroll failed (end of list?)"
              }

              // ------------------------------------------------------------------ feedback

              private fun finish(msg: String) {
                  emit("MJ: $msg")
                  setStatus(msg)
                  if (getSharedPreferences("mj", MODE_PRIVATE).getBoolean("voice", false)) speak(msg)
                  Thread.sleep(1200)
              }

              private fun emit(s: String) {
                  synchronized(logs) {
                      logs.add(s)
                      if (logs.size > 200) logs.removeAt(0)
                  }
                  sink?.invoke(s)
              }

              private fun speak(t: String) {
                  if (t.isNotBlank()) tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "mj")
              }

              private fun setStatus(t: String) {
                  ui.post { statusView?.text = t }
              }

              private fun showOverlay() {
                  ui.post {
                      if (overlay != null) return@post
                      val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setBackgroundColor(0xE6101820.toInt())
                      row.setPadding(24, 16, 24, 16)

                      val tv = TextView(this)
                      tv.setTextColor(Color.WHITE)
                      tv.textSize = 13f

                      val stop = Button(this)
                      stop.text = "STOP"
                      stop.setOnClickListener { cancelled = true }

                      row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(
                          stop,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      )

                      val lp = WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.BOTTOM
                      try {
                          wm.addView(row, lp)
                          overlay = row
                          statusView = tv
                      } catch (e: Exception) {
                          emit("overlay error: ${e.message}")
                      }
                  }
              }

              private fun hideOverlay() {
                  ui.post {
                      val o = overlay
                      if (o != null) {
                          try {
                              (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(o)
                          } catch (e: Exception) {
                          }
                      }
                      overlay = null
                      statusView = null
                  }
              }
          }
