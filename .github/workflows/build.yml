          package com.waqas.mj

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import java.io.ByteArrayOutputStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.sqrt

          /** wav = recorded sentence (null if nobody spoke). blocked = Android gave only digital silence. */
          class Rec(val wav: ByteArray?, val blocked: Boolean)

          /** True while the wake word listener holds the microphone. */
          object MicState {
              @Volatile
              var wakeHolding = false
          }

          /** Records one spoken sentence (16 kHz mono) and stops by itself when the speaker goes quiet. */
          object Recorder {

              private const val RATE = 16000

              /** What the last recording looked like (length and loudness), for the log. */
              @Volatile
              var lastInfo = ""

              /** Opens a 16 kHz mono microphone, or null if Android refuses. */
              fun open(): AudioRecord? {
                  val minBuf = AudioRecord.getMinBufferSize(
                      RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuf <= 0) return null
                  val bufBytes = max(minBuf, RATE * 2)
                  val sources = intArrayOf(MediaRecorder.AudioSource.VOICE_RECOGNITION, MediaRecorder.AudioSource.MIC)
                  for (src in sources) {
                      try {
                          val r = AudioRecord(
                              src, RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufBytes
                          )
                          if (r.state == AudioRecord.STATE_INITIALIZED) return r
                          r.release()
                      } catch (e: Exception) {
                      }
                  }
                  return null
              }

              /**
               * onChunk (optional) gets every 100 ms of audio while recording, for example to feed an
               * offline recogniser at the same time.
               */
              fun record(
                  waitStartMs: Long,
                  onChunk: ((ShortArray, Int) -> Unit)? = null,
                  cancelled: () -> Boolean
              ): Rec {
                  val t0 = System.currentTimeMillis()
                  while (MicState.wakeHolding && System.currentTimeMillis() - t0 < 900) Thread.sleep(30)

                  val chunk = RATE / 10
                  val r = open() ?: return Rec(null, true)

                  val pcm = ByteArrayOutputStream()
                  val buf = ShortArray(chunk)
                  var noise = Double.MAX_VALUE
                  var n = 0
                  var loud = 0
                  var quiet = 0
                  var spoken = 0
                  var started = false
                  var peak = 0
                  val waitChunks = (waitStartMs / 100).toInt()
                  try {
                      r.startRecording()
                      while (!cancelled()) {
                          val got = r.read(buf, 0, chunk)
                          if (got < 0) break
                          if (got == 0) continue

                          var sum = 0.0
                          for (i in 0 until got) {
                              val s = buf[i].toInt()
                              sum += (s * s).toDouble()
                              peak = max(peak, abs(s))
                              pcm.write(s and 0xFF)
                              pcm.write((s shr 8) and 0xFF)
                          }
                          onChunk?.invoke(buf, got)
                          val rms = sqrt(sum / got)
                          n++

                          if (n <= 8) noise = minOf(noise, rms)
                          if (n == 10 && peak <= 1) return Rec(null, true)

                          val floor = if (noise == Double.MAX_VALUE) 0.0 else noise
                          val thr = max(700.0, floor * 3.0)
                          if (n >= 3) {
                              if (!started) {
                                  if (rms > thr) {
                                      loud++
                                      if (loud >= 2) started = true
                                  } else {
                                      loud = 0
                                  }
                                  if (!started && n > waitChunks) return Rec(null, false)
                              } else {
                                  spoken++
                                  if (rms < thr * 0.8) quiet++ else quiet = 0
                                  if (quiet >= 9 || spoken > 200) break
                              }
                          }
                      }
                  } catch (e: Exception) {
                      return Rec(null, true)
                  } finally {
                      try {
                          r.stop()
                      } catch (e: Exception) {
                      }
                      r.release()
                  }
                  if (!started || cancelled()) return Rec(null, false)
                  val bytes = pcm.toByteArray()
                  lastInfo = "" + (bytes.size / 32) + " ms, loudness " + peak + " (theek: 4000 se upar)"
                  amplify(bytes, peak)
                  return Rec(wav(bytes), false)
              }

              /** Quiet or distant speech is made louder (at most 6x) so Gemini hears it clearly. */
              private fun amplify(b: ByteArray, peak: Int) {
                  if (peak < 1 || peak > 12000) return
                  val gain = minOf(6.0, 20000.0 / peak)
                  var i = 0
                  while (i + 1 < b.size) {
                      val s = (b[i].toInt() and 0xFF) or (b[i + 1].toInt() shl 8)
                      val v = (s * gain).toInt().coerceIn(-32768, 32767)
                      b[i] = (v and 0xFF).toByte()
                      b[i + 1] = ((v shr 8) and 0xFF).toByte()
                      i += 2
                  }
              }

              /** Plays a recording back, so the user can hear exactly what MJ heard. */
              fun playWav(wav: ByteArray) {
                  if (wav.size <= 44) return
                  val n = wav.size - 44
                  val t = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(RATE)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(n)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  try {
                      t.write(wav, 44, n)
                      t.play()
                      Thread.sleep(n / 32L + 400L)
                  } finally {
                      try {
                          t.stop()
                      } catch (e: Exception) {
                      }
                      t.release()
                  }
              }

              private fun wav(pcm: ByteArray): ByteArray {
                  val out = ByteArrayOutputStream(pcm.size + 44)
                  fun le32(v: Int) {
                      out.write(v and 0xFF)
                      out.write((v shr 8) and 0xFF)
                      out.write((v shr 16) and 0xFF)
                      out.write((v shr 24) and 0xFF)
                  }
                  fun le16(v: Int) {
                      out.write(v and 0xFF)
                      out.write((v shr 8) and 0xFF)
                  }
                  out.write("RIFF".toByteArray())
                  le32(36 + pcm.size)
                  out.write("WAVE".toByteArray())
                  out.write("fmt ".toByteArray())
                  le32(16)
                  le16(1)
                  le16(1)
                  le32(RATE)
                  le32(RATE * 2)
                  le16(2)
                  le16(16)
                  out.write("data".toByteArray())
                  le32(pcm.size)
                  out.write(pcm)
                  return out.toByteArray()
              }
          }
