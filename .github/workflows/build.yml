          package com.waqas.mj

          import android.Manifest
          import android.content.ActivityNotFoundException
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import android.telephony.SmsManager
          import java.net.URLEncoder

          /** One phone number of one contact. */
          class Contact(val id: Long, val name: String, val number: String, val label: String)

          /** Direct phone commands. These never touch the screen, so they are fast and cannot loop. */
          object Device {

              // ---------------------------------------------------------------- contacts, calls, WhatsApp, SMS

              /** All matching numbers, or null when the contacts permission is missing. */
              fun findContacts(ctx: Context, name: String): List<Contact>? {
                  if (ctx.checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      return null
                  }
                  val out = ArrayList<Contact>()
                  val seen = HashSet<String>()
                  val p = ContactsContract.CommonDataKinds.Phone.CONTENT_URI
                  val cols = arrayOf(
                      ContactsContract.CommonDataKinds.Phone.CONTACT_ID,
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                      ContactsContract.CommonDataKinds.Phone.NUMBER,
                      ContactsContract.CommonDataKinds.Phone.TYPE
                  )
                  val cur = ctx.contentResolver.query(
                      p, cols, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                      arrayOf("%" + name.trim() + "%"), null
                  )
                  cur?.use {
                      while (it.moveToNext()) {
                          val id = it.getLong(0)
                          val dn = it.getString(1) ?: ""
                          val num = it.getString(2) ?: ""
                          val type = it.getInt(3)
                          val digits = num.filter { ch -> ch.isDigit() }
                          if (digits.isEmpty()) continue
                          if (!seen.add(id.toString() + ":" + digits.takeLast(9))) continue
                          val label = ContactsContract.CommonDataKinds.Phone.getTypeLabel(ctx.resources, type, "").toString()
                          out.add(Contact(id, dn, num, label))
                      }
                  }
                  return out
              }

              /** Exact name matches first; the same real number is listed only once; at most 6. */
              fun pickCandidates(all: List<Contact>, name: String): List<Contact> {
                  val exact = all.filter { it.name.equals(name.trim(), ignoreCase = true) }
                  val use = if (exact.isNotEmpty()) exact else all
                  return use.distinctBy { c -> c.number.filter { ch -> ch.isDigit() }.takeLast(9) }.take(10)
              }

              fun describe(c: Contact): String {
                  val label = if (c.label.isNotBlank()) " (" + c.label + ")" else ""
                  return c.name + label + " ..." + c.number.filter { it.isDigit() }.takeLast(4)
              }

              /** Name, type and the whole number: shown on the screen, never read aloud. */
              fun describeFull(c: Contact): String {
                  val label = if (c.label.isNotBlank()) " (" + c.label + ")" else ""
                  return c.name + label + "  " + c.number
              }

              private fun mediaGranted(ctx: Context, video: Boolean): Boolean {
                  val perm = if (Build.VERSION.SDK_INT >= 33) {
                      if (video) Manifest.permission.READ_MEDIA_VIDEO else Manifest.permission.READ_MEDIA_IMAGES
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }
                  return ctx.checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED
              }

              /** The newest photo or video in the gallery (null if none or no permission). */
              fun latestMedia(ctx: Context, video: Boolean): Uri? {
                  if (!mediaGranted(ctx, video)) return null
                  val base = if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  return try {
                      ctx.contentResolver.query(
                          base, arrayOf(MediaStore.MediaColumns._ID), null, null,
                          MediaStore.MediaColumns.DATE_ADDED + " DESC"
                      )?.use {
                          if (it.moveToFirst()) ContentUris.withAppendedId(base, it.getLong(0)) else null
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              /** Opens that person's WhatsApp chat with the photo or video ready to send. */
              fun shareToWhatsApp(ctx: Context, uri: Uri, video: Boolean, number: String, cc: String, caption: String): String {
                  val i = Intent(Intent.ACTION_SEND)
                  i.type = if (video) "video/*" else "image/*"
                  i.putExtra(Intent.EXTRA_STREAM, uri)
                  if (caption.isNotBlank()) i.putExtra(Intent.EXTRA_TEXT, caption)
                  i.setPackage("com.whatsapp")
                  i.putExtra("jid", waNumber(number, cc) + "@s.whatsapp.net")
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      "opened the chat with the latest " + (if (video) "video" else "photo") + " ready"
                  } catch (e: Exception) {
                      "cannot share to WhatsApp: ${e.message}"
                  }
              }

              fun setAlarm(ctx: Context, hour: Int, minute: Int, label: String): String {
                  if (hour !in 0..23 || minute !in 0..59) return "alarm error: waqt samajh nahi aaya"
                  val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, label)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      "alarm set for %02d:%02d".format(hour, minute) + (if (label.isNotBlank()) " ($label)" else "")
                  } catch (e: Exception) {
                      "alarm error: ${e.message}"
                  }
              }

              fun setTimer(ctx: Context, seconds: Int, label: String): String {
                  if (seconds < 1) return "timer error: samay samajh nahi aaya"
                  val i = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, label)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      "timer set for $seconds seconds" + (if (label.isNotBlank()) " ($label)" else "")
                  } catch (e: Exception) {
                      "timer error: ${e.message}"
                  }
              }

              fun callNumber(ctx: Context, number: String): String {
                  val uri = Uri.parse("tel:" + Uri.encode(number))
                  return try {
                      if (ctx.checkSelfPermission(Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                          ctx.startActivity(Intent(Intent.ACTION_CALL, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          "calling $number"
                      } else {
                          ctx.startActivity(Intent(Intent.ACTION_DIAL, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          "dialer opened with $number (CALL permission nahi hai, call button dabana hoga)"
                      }
                  } catch (e: Exception) {
                      "cannot call: ${e.message}"
                  }
              }

              private fun waNumber(n: String, cc: String): String {
                  val d = n.filter { it.isDigit() }
                  if (n.trim().startsWith("+")) return d
                  if (d.startsWith("00")) return d.substring(2)
                  if (d.startsWith("0")) return cc + d.substring(1)
                  return if (d.length <= 10) cc + d else d
              }

              /** Opens the person's chat directly (never their profile picture). */
              fun whatsappChat(ctx: Context, number: String, text: String, cc: String): String {
                  val d = waNumber(number, cc)
                  var url = "https://wa.me/$d"
                  if (text.isNotBlank()) url += "?text=" + URLEncoder.encode(text, "UTF-8")
                  val r = openUrl(ctx, url, "com.whatsapp")
                  val extra = if (text.isNotBlank()) ", message text is typed in the box" else ""
                  return "$r (whatsapp chat $d$extra)"
              }

              @Suppress("DEPRECATION")
              fun sendSms(ctx: Context, number: String, text: String): String {
                  if (ctx.checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                      return "SMS permission nahi hai: MJ app mein '6) Contacts/Call/SMS permission' dabayein"
                  }
                  if (text.isBlank()) return "sms ka text khali hai (nahi bheja)"
                  return try {
                      val sm = SmsManager.getDefault()
                      sm.sendMultipartTextMessage(number, null, sm.divideMessage(text), null, null)
                      "sms sent to $number"
                  } catch (e: Exception) {
                      "sms error: ${e.message}"
                  }
              }

              // ---------------------------------------------------------------- device

              fun flashlight(ctx: Context, on: Boolean, seconds: Int = 0): String {
                  return try {
                      val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var id: String? = null
                      for (cid in cm.cameraIdList) {
                          val c = cm.getCameraCharacteristics(cid)
                          val hasFlash = c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          val back = c.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                          if (hasFlash && back) {
                              id = cid
                              break
                          }
                      }
                      if (id == null) {
                          "flashlight not found on this phone"
                      } else if (on && seconds > 0) {
                          cm.setTorchMode(id, true)
                          Thread.sleep(seconds.coerceIn(1, 60) * 1000L)
                          cm.setTorchMode(id, false)
                          "flashlight was on for $seconds seconds, now off"
                      } else {
                          cm.setTorchMode(id, on)
                          if (on) "flashlight on" else "flashlight off"
                      }
                  } catch (e: Exception) {
                      "flashlight error: ${e.message}"
                  }
              }

              fun openApp(ctx: Context, name: String): String {
                  val pm = ctx.packageManager
                  val probe = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(probe, 0)
                  val q = name.lowercase().trim()
                  if (q.isEmpty()) return "no app name given"
                  val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "app '$name' not found"
                  val launch = pm.getLaunchIntentForPackage(hit.activityInfo.packageName)
                      ?: return "cannot launch ${hit.loadLabel(pm)}"
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(launch)
                      "opened ${hit.loadLabel(pm)}"
                  } catch (e: Exception) {
                      "cannot open: ${e.message}"
                  }
              }

              fun openUrl(ctx: Context, url: String, pkg: String? = null): String {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  if (pkg != null) i.setPackage(pkg)
                  return try {
                      ctx.startActivity(i)
                      "opened"
                  } catch (e: ActivityNotFoundException) {
                      try {
                          i.setPackage(null)
                          ctx.startActivity(i)
                          "opened in browser"
                      } catch (e2: Exception) {
                          "cannot open: ${e2.message}"
                      }
                  } catch (e: Exception) {
                      "cannot open: ${e.message}"
                  }
              }

              fun youtubeSearch(ctx: Context, query: String): String {
                  val url = "https://www.youtube.com/results?search_query=" + URLEncoder.encode(query, "UTF-8")
                  return openUrl(ctx, url, "com.google.android.youtube") + " (youtube search: $query)"
              }

              fun webSearch(ctx: Context, query: String): String {
                  val url = "https://www.google.com/search?q=" + URLEncoder.encode(query, "UTF-8")
                  return openUrl(ctx, url, "com.android.chrome") + " (web search in Chrome: $query)"
              }

              fun maps(ctx: Context, query: String, route: Boolean): String {
                  if (query.isBlank()) return "no place given"
                  val q = URLEncoder.encode(query, "UTF-8")
                  val url = if (route) {
                      "https://www.google.com/maps/dir/?api=1&destination=$q&travelmode=driving"
                  } else {
                      "https://www.google.com/maps/search/?api=1&query=$q"
                  }
                  val r = openUrl(ctx, url, "com.google.android.apps.maps")
                  return if (route) "$r (route to $query)" else "$r (map search $query)"
              }

              fun openSettings(ctx: Context, page: String): String {
                  val p = page.lowercase().trim()
                  val action = when {
                      p.contains("wifi") || p.contains("wi-fi") -> Settings.ACTION_WIFI_SETTINGS
                      p.contains("bluetooth") -> Settings.ACTION_BLUETOOTH_SETTINGS
                      p.contains("location") || p.contains("gps") -> Settings.ACTION_LOCATION_SOURCE_SETTINGS
                      p.contains("hotspot") || p.contains("tether") -> Settings.ACTION_WIRELESS_SETTINGS
                      p.contains("airplane") || p.contains("flight") -> Settings.ACTION_AIRPLANE_MODE_SETTINGS
                      p.contains("display") || p.contains("brightness") -> Settings.ACTION_DISPLAY_SETTINGS
                      p.contains("sound") || p.contains("volume") -> Settings.ACTION_SOUND_SETTINGS
                      p.contains("battery") -> Settings.ACTION_BATTERY_SAVER_SETTINGS
                      p.contains("data") || p.contains("network") || p.contains("mobile") -> Settings.ACTION_DATA_ROAMING_SETTINGS
                      p.contains("nfc") -> Settings.ACTION_NFC_SETTINGS
                      p.contains("storage") -> Settings.ACTION_INTERNAL_STORAGE_SETTINGS
                      p.contains("app") -> Settings.ACTION_APPLICATION_SETTINGS
                      p.contains("date") || p.contains("time") -> Settings.ACTION_DATE_SETTINGS
                      p.contains("accessib") -> Settings.ACTION_ACCESSIBILITY_SETTINGS
                      else -> Settings.ACTION_SETTINGS
                  }
                  return try {
                      ctx.startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      "opened settings page '$page'"
                  } catch (e: Exception) {
                      try {
                          ctx.startActivity(Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          "opened main settings (page '$page' not available)"
                      } catch (e2: Exception) {
                          "cannot open settings: ${e2.message}"
                      }
                  }
              }

              fun brightness(ctx: Context, level: Int): String {
                  if (!Settings.System.canWrite(ctx)) {
                      return "brightness permission nahi hai: MJ app mein '5) Brightness permission' dabayein"
                  }
                  return try {
                      val pct = level.coerceIn(0, 100)
                      val v = (pct * 255 / 100).coerceAtLeast(1)
                      Settings.System.putInt(
                          ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE,
                          Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL
                      )
                      Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS, v)
                      "brightness $pct%"
                  } catch (e: Exception) {
                      "brightness error: ${e.message}"
                  }
              }

              /** Opens the dialer with the number filled in. The user (or a later step) presses call. */
              fun dial(ctx: Context, number: String): String {
                  val i = Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(number)))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      ctx.startActivity(i)
                      "dialer opened with $number"
                  } catch (e: Exception) {
                      "cannot open dialer: ${e.message}"
                  }
              }

              fun volume(ctx: Context, direction: String, level: Int = -1): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  if (level in 0..100 || direction == "max" || direction == "min") {
                      val pct = when {
                          level in 0..100 -> level
                          direction == "max" -> 100
                          else -> 0
                      }
                      val top = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      val v = (top * pct / 100.0).toInt().coerceIn(0, top)
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, v, AudioManager.FLAG_SHOW_UI)
                      return "volume $pct%"
                  }
                  val d = when (direction) {
                      "up" -> AudioManager.ADJUST_RAISE
                      "down" -> AudioManager.ADJUST_LOWER
                      "mute" -> AudioManager.ADJUST_MUTE
                      "unmute" -> AudioManager.ADJUST_UNMUTE
                      else -> return "bad volume direction '$direction'"
                  }
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, AudioManager.FLAG_SHOW_UI)
                  return "volume $direction"
              }
          }
