          package com.waqas.mj

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import org.vosk.Recognizer

          /**
           * Always-listening wake word. A foreground service (so Android keeps the microphone open)
           * runs Vosk offline. When the wake word is heard it frees the microphone and starts a normal
           * MJ conversation, then goes back to listening.
           */
          class WakeService : Service() {

              companion object {
                  private const val CHANNEL = "mjwake"
                  private const val NOTIF_ID = 17
                  const val DEFAULT_WORDS = "एम जे, एमजे"
              }

              @Volatile
              private var running = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      getSharedPreferences("mj", Context.MODE_PRIVATE).edit().putBoolean("wake", false).apply()
                      running = false
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  try {
                      startAsForeground()
                  } catch (e: Exception) {
                      log("Wake service start nahi hui: ${e.message}")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!running) {
                      running = true
                      Thread { loop() }.start()
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  super.onDestroy()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "MJ wake word", NotificationManager.IMPORTANCE_LOW)
                  )
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, WakeService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, CHANNEL)
                      .setContentTitle("MJ sun rahi hai")
                      .setContentText("Wake word bol kar bulayein")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(android.R.drawable.ic_media_pause, "Band karein", stop).build())
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
              }

              private fun log(s: String) {
                  synchronized(MJService.logs) {
                      MJService.logs.add(s)
                      if (MJService.logs.size > 200) MJService.logs.removeAt(0)
                  }
                  MJService.sink?.invoke(s)
              }

              private fun words(): List<String> {
                  val raw = getSharedPreferences("mj", Context.MODE_PRIVATE).getString("wakeWords", DEFAULT_WORDS)
                      ?: DEFAULT_WORDS
                  return raw.split(",").map { squash(it) }.filter { it.isNotEmpty() }
              }

              /** True if the heard text holds the wake word, allowing one wrong letter in words of 5+ letters. */
              private fun close(heard: String, word: String): Boolean {
                  if (heard.contains(word)) return true
                  if (word.length < 5) return false
                  val n = word.length
                  for (len in (n - 1)..(n + 1)) {
                      var i = 0
                      while (i + len <= heard.length) {
                          if (edit(heard.substring(i, i + len), word) <= 1) return true
                          i++
                      }
                  }
                  return false
              }

              private fun edit(a: String, b: String): Int {
                  var prev = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      val cur = IntArray(b.length + 1)
                      cur[0] = i
                      for (j in 1..b.length) {
                          val c = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c)
                      }
                      prev = cur
                  }
                  return prev[b.length]
              }

              private fun squash(s: String): String = s.lowercase().replace(Regex("[\\s.,!?।]"), "")

              private fun loop() {
                  log("Wake word sun rahi hai")
                  while (running) {
                      val svc = MJService.instance
                      if (svc == null || svc.isBusy()) {
                          Thread.sleep(500)
                          continue
                      }
                      val rec = VoskHelper.newRecognizer(this)
                      if (rec == null) {
                          log("Wake word ke liye Vosk model nahi mila")
                          Thread.sleep(4000)
                          continue
                      }
                      val hit = listen(rec, words())
                      try {
                          rec.close()
                      } catch (e: Exception) {
                      }
                      if (hit && running) {
                          log("Wake word suna")
                          svc.startConversation()
                          Thread.sleep(800)
                          while (running && svc.isBusy()) Thread.sleep(400)
                          Thread.sleep(600)
                      } else {
                          Thread.sleep(300)
                      }
                  }
                  log("Wake word band")
              }

              /** Returns true when a wake word was heard. */
              private fun listen(rec: Recognizer, wake: List<String>): Boolean {
                  if (wake.isEmpty()) return false
                  val r = Recorder.open() ?: return false
                  MicState.wakeHolding = true
                  try {
                      r.startRecording()
                      val buf = ShortArray(1600)
                      while (running) {
                          val svc = MJService.instance
                          if (svc == null || svc.isBusy()) return false
                          val got = r.read(buf, 0, buf.size)
                          if (got < 0) return false
                          if (got == 0) continue
                          val isFinal = rec.acceptWaveForm(buf, got)
                          val txt = if (isFinal) VoskHelper.text(rec.getResult()) else VoskHelper.partial(rec.getPartialResult())
                          if (txt.isNotEmpty()) {
                              val s = squash(txt)
                              if (wake.any { close(s, it) }) return true
                          }
                      }
                  } catch (e: Exception) {
                      return false
                  } finally {
                      try {
                          r.stop()
                      } catch (e: Exception) {
                      }
                      r.release()
                      MicState.wakeHolding = false
                  }
                  return false
              }
          }
          MJEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'MJEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MJ</string>
              <string name="service_desc">MJ aap ke kehne par screen padhti hai aur tap, type, scroll jaise kaam karti hai.</string>
          </resources>
          MJEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'MJEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          MJEOF
          cat > build.gradle.kts <<'MJEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          MJEOF
          cat > gradle.properties <<'MJEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          MJEOF
          cat > settings.gradle.kts <<'MJEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MJ"
          include(":app")
          MJEOF
          base64 -d app/mj.keystore.b64 > app/mj.keystore
          echo 'project written:' && find . -type f -not -path './.git/*' | head -50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJ-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mj-build-${{ github.run_number }}
          name: MJ build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
