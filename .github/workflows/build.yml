          package com.waqas.mj

          import android.content.Context
          import android.net.Uri
          import org.json.JSONObject
          import org.vosk.LibVosk
          import org.vosk.LogLevel
          import org.vosk.Model
          import org.vosk.Recognizer
          import java.io.BufferedInputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.util.zip.ZipInputStream

          /**
           * Collects what Vosk recognises while audio is being recorded.
           * Vosk works on its own thread, so a slow phone can never make the recorder lose audio.
           */
          class VoskSession(private val rec: Recognizer) {
              private val sb = StringBuilder()
              private val q = java.util.concurrent.LinkedBlockingQueue<ShortArray>()
              private val worker = Thread {
                  try {
                      while (true) {
                          val b = q.take()
                          if (b.isEmpty()) break
                          if (rec.acceptWaveForm(b, b.size)) {
                              val t = VoskHelper.text(rec.getResult())
                              if (t.isNotEmpty()) sb.append(t).append(' ')
                          }
                      }
                  } catch (e: Exception) {
                  }
              }

              init {
                  worker.start()
              }

              fun feed(buf: ShortArray, n: Int) {
                  q.offer(buf.copyOf(n))
              }

              fun finish(): String {
                  q.offer(ShortArray(0))
                  try {
                      worker.join(5000)
                  } catch (e: InterruptedException) {
                  }
                  if (worker.isAlive) return sb.toString().trim()
                  try {
                      val t = VoskHelper.text(rec.getFinalResult())
                      if (t.isNotEmpty()) sb.append(t)
                  } catch (e: Exception) {
                  }
                  try {
                      rec.close()
                  } catch (e: Exception) {
                  }
                  return sb.toString().trim()
              }
          }

          /** Offline speech recognition (Vosk Hindi model that the user picked from the phone). */
          object VoskHelper {

              @Volatile
              private var model: Model? = null

              private fun path(ctx: Context): String? {
                  val p = ctx.getSharedPreferences("mj", Context.MODE_PRIVATE).getString("voskPath", "") ?: ""
                  return if (p.isNotBlank() && File(p, "am").isDirectory) p else null
              }

              fun hasModel(ctx: Context): Boolean = path(ctx) != null

              @Synchronized
              fun load(ctx: Context): Model? {
                  val m = model
                  if (m != null) return m
                  val p = path(ctx) ?: return null
                  return try {
                      LibVosk.setLogLevel(LogLevel.WARNINGS)
                      val nm = Model(p)
                      model = nm
                      nm
                  } catch (e: Throwable) {
                      null
                  }
              }

              fun newRecognizer(ctx: Context): Recognizer? {
                  val m = load(ctx) ?: return null
                  return try {
                      Recognizer(m, 16000.0f)
                  } catch (e: Throwable) {
                      null
                  }
              }

              fun session(ctx: Context): VoskSession? {
                  val r = newRecognizer(ctx) ?: return null
                  return VoskSession(r)
              }

              fun text(json: String): String = try {
                  JSONObject(json).optString("text", "").trim()
              } catch (e: Exception) {
                  ""
              }

              fun partial(json: String): String = try {
                  JSONObject(json).optString("partial", "").trim()
              } catch (e: Exception) {
                  ""
              }

              /** Unzips the chosen model zip into the app's own storage and remembers where it is. */
              fun install(ctx: Context, uri: Uri, progress: (String) -> Unit): String {
                  val base = File(ctx.filesDir, "vosk-model")
                  try {
                      base.deleteRecursively()
                      base.mkdirs()
                      model?.close()
                      model = null
                      val input = ctx.contentResolver.openInputStream(uri) ?: return "File khul nahi saki"
                      var count = 0
                      ZipInputStream(BufferedInputStream(input)).use { zin ->
                          var e = zin.nextEntry
                          while (e != null) {
                              val out = File(base, e.name)
                              val safe = out.canonicalPath.startsWith(base.canonicalPath + File.separator)
                              if (safe) {
                                  if (e.isDirectory) {
                                      out.mkdirs()
                                  } else {
                                      out.parentFile?.mkdirs()
                                      FileOutputStream(out).use { o -> zin.copyTo(o) }
                                      count++
                                      if (count % 15 == 0) progress("Model copy ho raha hai... ($count files)")
                                  }
                              }
                              zin.closeEntry()
                              e = zin.nextEntry
                          }
                      }
                      val root = findRoot(base, 0)
                          ?: return "Zip ke andar model folder nahi mila (am/conf folders chahiye). Sahi Vosk Hindi model ki zip chunein"
                      ctx.getSharedPreferences("mj", Context.MODE_PRIVATE)
                          .edit().putString("voskPath", root.absolutePath).apply()
                      return "Vosk model lag gaya ($count files)"
                  } catch (e: Throwable) {
                      return "Model lagane mein error: ${e.message}"
                  }
              }

              private fun findRoot(dir: File, depth: Int): File? {
                  if (File(dir, "am").isDirectory && File(dir, "conf").isDirectory) return dir
                  if (depth >= 3) return null
                  val kids = dir.listFiles() ?: return null
                  for (k in kids) {
                      if (k.isDirectory) {
                          val r = findRoot(k, depth + 1)
                          if (r != null) return r
                      }
                  }
                  return null
              }

              /** Listens for a few seconds and shows what Vosk wrote, so the wake word can be tuned. */
              fun test(ctx: Context, seconds: Int, out: (String) -> Unit) {
                  if (MicState.wakeHolding) {
                      out("Pehle Wake word OFF karke Save karein, phir test karein")
                      return
                  }
                  val s = session(ctx)
                  if (s == null) {
                      out("Vosk model nahi mila ya load nahi hua")
                      return
                  }
                  val r = Recorder.open()
                  if (r == null) {
                      s.finish()
                      out("Mic nahi khula")
                      return
                  }
                  try {
                      r.startRecording()
                      out("Vosk test: $seconds second bolein...")
                      val buf = ShortArray(1600)
                      val end = System.currentTimeMillis() + seconds * 1000L
                      while (System.currentTimeMillis() < end) {
                          val got = r.read(buf, 0, buf.size)
                          if (got < 0) break
                          if (got > 0) s.feed(buf, got)
                      }
                  } catch (e: Exception) {
                      out("Vosk test error: ${e.message}")
                  } finally {
                      try {
                          r.stop()
                      } catch (e: Exception) {
                      }
                      r.release()
                  }
                  val t = s.finish()
                  out("Vosk ne suna: " + (if (t.isEmpty()) "(kuch nahi)" else t))
              }
          }
