          package com.waqas.mj

          import android.view.accessibility.AccessibilityNodeInfo

          /** A numbered picture of what is on screen right now. */
          class ScreenSnapshot(
              val text: String,
              val nodes: List<AccessibilityNodeInfo>,
              val hash: Int,
              val pkg: String
          )

          object ScreenReader {

              fun read(root: AccessibilityNodeInfo?): ScreenSnapshot {
                  if (root == null) return ScreenSnapshot("(screen not readable)", emptyList(), 0, "")
                  val nodes = ArrayList<AccessibilityNodeInfo>()
                  val sb = StringBuilder()
                  walk(root, nodes, sb)
                  val body = if (sb.isEmpty()) "(empty screen)" else sb.toString()
                  return ScreenSnapshot(body, nodes, body.hashCode(), root.packageName?.toString() ?: "")
              }

              private fun walk(n: AccessibilityNodeInfo?, nodes: ArrayList<AccessibilityNodeInfo>, sb: StringBuilder) {
                  if (n == null || nodes.size >= 80 || !n.isVisibleToUser) return
                  val label = (n.text?.toString() ?: n.contentDescription?.toString() ?: n.hintText?.toString() ?: "").trim()
                  val keep = n.isClickable || n.isEditable || n.isScrollable || n.isCheckable || label.isNotEmpty()
                  if (keep) {
                      val kind = when {
                          n.isEditable -> "input"
                          n.isClickable -> "button"
                          n.isScrollable -> "scroll"
                          else -> "text"
                      }
                      sb.append('[').append(nodes.size).append("] ").append(kind)
                      if (label.isNotEmpty()) {
                          sb.append(" \"").append(label.take(60).replace("\n", " ")).append('"')
                      }
                      if (n.isChecked) sb.append(" (checked)")
                      sb.append('\n')
                      nodes.add(n)
                  }
                  for (i in 0 until n.childCount) {
                      walk(n.getChild(i), nodes, sb)
                  }
              }
          }
