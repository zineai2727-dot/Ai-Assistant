          package com.waqas.mj

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** MJ's memory on the phone: what she did recently and things Waqas asked her to remember. */
          object Memory {

              private fun prefs(ctx: Context) = ctx.getSharedPreferences("mjmem", Context.MODE_PRIVATE)

              @Synchronized
              fun addWork(ctx: Context, task: String, ok: Boolean, result: String) {
                  val arr = try {
                      JSONArray(prefs(ctx).getString("work", "[]"))
                  } catch (e: Exception) {
                      JSONArray()
                  }
                  val e = JSONObject()
                      .put("t", SimpleDateFormat("d MMM HH:mm", Locale.ENGLISH).format(Date()))
                      .put("task", task.take(160))
                      .put("ok", ok)
                      .put("result", result.take(160))
                  arr.put(e)
                  val out = JSONArray()
                  for (i in maxOf(0, arr.length() - 20) until arr.length()) out.put(arr.get(i))
                  prefs(ctx).edit().putString("work", out.toString()).apply()
              }

              @Synchronized
              fun addNote(ctx: Context, note: String) {
                  val n = note.trim().take(200)
                  if (n.isEmpty()) return
                  val arr = try {
                      JSONArray(prefs(ctx).getString("notes", "[]"))
                  } catch (e: Exception) {
                      JSONArray()
                  }
                  for (i in 0 until arr.length()) if (arr.optString(i) == n) return
                  arr.put(n)
                  val out = JSONArray()
                  for (i in maxOf(0, arr.length() - 40) until arr.length()) out.put(arr.get(i))
                  prefs(ctx).edit().putString("notes", out.toString()).apply()
              }

              @Synchronized
              fun forgetNotes(ctx: Context) {
                  prefs(ctx).edit().remove("notes").apply()
              }

              /** Text given to the AI so it knows what happened before and what to remember. */
              @Synchronized
              fun context(ctx: Context): String {
                  val sb = StringBuilder()
                  sb.append("NOW: ").append(SimpleDateFormat("EEEE d MMM yyyy, HH:mm", Locale.ENGLISH).format(Date())).append("\n")
                  val notes = try {
                      JSONArray(prefs(ctx).getString("notes", "[]"))
                  } catch (e: Exception) {
                      JSONArray()
                  }
                  sb.append("THINGS TO REMEMBER (he asked you to keep these):\n")
                  if (notes.length() == 0) sb.append("(none)\n")
                  for (i in 0 until notes.length()) sb.append("- ").append(notes.optString(i)).append("\n")
                  val work = try {
                      JSONArray(prefs(ctx).getString("work", "[]"))
                  } catch (e: Exception) {
                      JSONArray()
                  }
                  sb.append("RECENT WORK DONE BY YOU (oldest first, newest last):\n")
                  if (work.length() == 0) sb.append("(none)\n")
                  for (i in maxOf(0, work.length() - 10) until work.length()) {
                      val w = work.getJSONObject(i)
                      sb.append("- ").append(w.optString("t")).append(" | ").append(w.optString("task"))
                          .append(" | ").append(if (w.optBoolean("ok")) "DONE" else "NOT DONE").append(": ")
                          .append(w.optString("result")).append("\n")
                  }
                  return sb.toString()
              }
          }
