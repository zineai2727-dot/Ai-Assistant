              }

              // ------------------------------------------------------------------ public

              /** A typed command (one turn, no listening afterwards). */
              fun runCommand(text: String) {
                  start { turn(null, text, false, false) }
              }

              /** Bubble / mic button: starts a spoken conversation, or stops it if one is running. */
              fun startConversation() {
                  if (busy.get()) {
                      stopAll()
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
